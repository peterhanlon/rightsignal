radar:
- name: Gemini 4 Neon
  maker: Google DeepMind
  target: best overall LLM
  released: 2026-11-18
  status: in product
  scored: false
  note: A further member of the Gemini 4 family, announced the same day as Genie 4
    and following Carbon and Hydrogen. The announcement carries no published specification
    or benchmark detail in the material available, so even its positioning relative
    to Gemini 4 Carbon is unclear. Worth watching only until someone runs it independently.
  sources:
  - https://deepmind.google/blog/introducing-gemini-4-neon/
  card: Another Gemini 4 variant, details still thin
- name: GPT-6.2 Astra
  maker: OpenAI
  target: best overall LLM
  released: 2026-11-17
  status: in product
  scored: true
  note: A point upgrade to OpenAI's frontier line, launched alongside a sibling named
    Sol and rolled out across ChatGPT Work, Codex and the API. The claimed combination
    is better professional output, coding and computer use at lower cost than GPT-6
    Astra, and a companion post places an Astra for Law variant first in a 24-area
    legal evaluation run by OpenAI itself. No third-party measurement of the coding
    or agentic gains has appeared yet, and the division of labour between Astra and
    Sol is not spelled out.
  sources:
  - https://openai.com/index/introducing-gpt-6-2-astra-sol
  - https://openai.com/index/astra-law-6-2
  card: OpenAI's point upgrade to the Astra line
- name: Inkling-2-Mini
  maker: Thinking Machines
  target: best small / on-device LLM
  released: 2026-11-17
  status: weights out
  scored: false
  note: 'The smaller sibling to Inkling-2-Small: a mixture-of-experts model that takes
    image and text input, shipped under Apache-2.0 with 8-bit checkpoints. Community
    GGUF conversions appeared within three days, which says something about how readily
    it runs locally. Nothing independent yet on quality per watt or how it holds up
    against the current small-model field.'
  sources:
  - https://huggingface.co/thinkingmachines/Inkling-2-Mini
  card: Apache-2.0 vision-capable MoE, built to run local
- name: Hy4-flash
  maker: Tencent
  target: best open-weight LLM
  released: 2026-11-17
  status: weights out
  scored: false
  note: Tencent's fast Hunyuan 4 variant, a multimodal instruct MoE with safetensors
    weights on Hugging Face. Notably it is a full fourth-generation Hunyuan release
    put out as open weights rather than held back behind an API, though under a bespoke
    licence rather than a standard permissive one. No published evaluations yet, and
    the licence terms will matter as much as the scores for anyone deploying it.
  sources:
  - https://huggingface.co/tencent/Hy4-flash
  card: Hunyuan 4's fast variant, weights on a custom licence
- name: SenseNova-Loop-9B
  maker: SenseTime
  target: best small / on-device LLM
  released: 2026-11-17
  status: weights out
  scored: false
  note: 'A 9B bilingual multimodal model built as a looped transformer, reusing layers
    at inference instead of adding depth. The architecture is the interesting part:
    parameter count stays small while effective compute can be dialled up per query.
    Whether that trades favourably against a conventional dense model of the same
    size is entirely untested outside SenseTime.'
  sources:
  - https://huggingface.co/sensenova/SenseNova-Loop-9B
  card: 9B looped transformer, depth traded for recompute
- name: Gemini 4 Hydrogen
  maker: Google DeepMind
  target: best overall LLM
  released: 2026-11-12
  status: preview
  scored: false
  note: 'A new member of the Gemini 4 family, announced two days after Carbon became
    generally available. The only verified fact so far is the announcement itself:
    DeepMind has published nothing in the way of benchmark detail, pricing or availability
    tiers alongside it. Whether Hydrogen sits above or beside Carbon, and how it behaves
    on long-horizon reasoning, is entirely unproven.'
  sources:
  - https://deepmind.google/blog/introducing-gemini-4-hydrogen/
  card: New Gemini 4 tier, announced with no numbers yet
- name: ZONOS3-Mini
  maker: Zyphra
  target: best open-weight TTS
  released: 2026-11-09
  status: weights out
  scored: false
  note: 'The small member of Zyphra''s third-generation Zonos speech synthesis line,
    with multilingual voice cloning and both safetensors and GGUF weights at launch.
    Shipping quantised GGUF on day one is the striking part: it is aimed squarely
    at local, CPU-friendly deployment. Intelligibility and speaker-similarity scores
    against the incumbent open models have not been published or independently measured.'
  sources:
  - https://huggingface.co/Zyphra/ZONOS3-Mini
  card: Zonos 3 in a small size, GGUF weights from day one
- name: Inkling-2-Small
  maker: Thinking Machines
  target: best small / on-device LLM
  released: 2026-11-04
  status: weights out
  scored: false
  note: Thinking Machines' second-generation Inkling, a compact mixture-of-experts
    model with vision input, released under Apache 2.0. The permissive licence on
    a multimodal MoE is unusual at this size, and the repository ships 8-bit ModelOpt
    weights alongside the full checkpoint. Parameter counts, active-expert budget
    and real on-device latency remain unverified by anyone outside the lab.
  sources:
  - https://huggingface.co/thinkingmachines/Inkling-2-Small
  card: Apache-2.0 multimodal MoE aimed at small deployments
- name: LongCat-2.5
  maker: Meituan
  target: best open-weight LLM
  released: 2026-11-04
  status: weights out
  scored: false
  note: Meituan's latest LongCat release, an MIT-licensed mixture-of-experts model
    with multimodal input and an explicitly agentic framing. An MIT licence on a flagship-scale
    MoE is the most concrete thing here, leaving redistribution and commercial use
    unencumbered. Agentic and tool-use claims rest on the accompanying papers; no
    third-party evaluation has appeared.
  sources:
  - https://huggingface.co/meituan-longcat/LongCat-2.5
  card: MIT-licensed multimodal MoE with an agentic pitch
- name: Images 2.6
  maker: OpenAI
  target: best image generation
  released: 2026-11-04
  status: in product
  scored: false
  note: OpenAI's updated image model, available across ChatGPT, Codex and the API,
    adding animated GIF output and finer editing controls. The notable addition is
    generation speed plus new API-side controls, which matters more for production
    work than for gallery shots. OpenAI has published no side-by-side quality figures
    against its own GPT-Image-2.5-Sunburst, so whether fidelity improved or merely
    latency is unclear.
  sources:
  - https://openai.com/index/introducing-images-2-6
  card: Faster OpenAI image model, now with GIF output
- name: MiniMax-H3-Image
  maker: MiniMax
  target: best image generation
  released: 2026-11-03
  status: weights out
  scored: false
  note: An open-weight text-to-image and image-editing model built on MiniMax's H3
    base, shipped in diffusers format under a custom licence. Notably it covers generation,
    image-to-image and editing in one checkpoint, and ComfyUI packaging and GGUF conversions
    appeared within a week. No independent comparison against the current closed leaders
    on prompt adherence or text rendering yet exists.
  sources:
  - https://huggingface.co/MiniMaxAI/MiniMax-H3-Image
  - https://huggingface.co/Comfy-Org/MiniMax-H3-Image
  card: 'MiniMax''s open image model: generate and edit in one'
- name: Kimi-K3.1-Pro
  maker: Moonshot AI
  target: best open-weight LLM
  released: 2026-11-02
  status: weights out
  scored: true
  note: Moonshot's latest open-weight flagship, published with vision input alongside
    text and shipped as compressed-tensors 8-bit checkpoints rather than full-precision
    weights. The repository carries Moonshot's own eval results and is listed as endpoints-compatible,
    so it can be served without bespoke glue. No independent reproduction of those
    numbers yet, and the 8-bit-only release makes like-for-like comparison with other
    open flagships harder.
  sources:
  - https://huggingface.co/moonshotai/Kimi-K3.1-Pro
  card: Moonshot's new open flagship, 8-bit multimodal
