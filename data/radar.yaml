radar:
- name: Images 2.6
  maker: OpenAI
  target: best image generation
  released: 2026-11-04
  status: in product
  scored: false
  note: OpenAI's updated image model, available across ChatGPT, Codex and the API,
    adding animated GIF output and finer editing controls. The notable addition is
    generation speed plus new API-side controls, which matters more for production
    work than for gallery shots. OpenAI has published no side-by-side quality figures
    against its own GPT-Image-2.5-Sunburst, so whether fidelity improved or merely
    latency is unclear.
  sources:
  - https://openai.com/index/introducing-images-2-6
  card: Faster OpenAI image model, now with GIF output
- name: Kimi-K3.1-Pro
  maker: Moonshot AI
  target: best open-weight LLM
  released: 2026-11-02
  status: weights out
  scored: true
  note: Moonshot's latest open-weight flagship, published with vision input alongside
    text and shipped as compressed-tensors 8-bit checkpoints rather than full-precision
    weights. The repository carries Moonshot's own eval results and is listed as endpoints-compatible,
    so it can be served without bespoke glue. No independent reproduction of those
    numbers yet, and the 8-bit-only release makes like-for-like comparison with other
    open flagships harder.
  sources:
  - https://huggingface.co/moonshotai/Kimi-K3.1-Pro
  card: Moonshot's new open flagship, 8-bit multimodal
- name: Gemini 4 Carbon
  maker: Google DeepMind
  target: best overall LLM
  released: 2026-10-28
  status: API only
  scored: true
  note: Google's new frontier model, announced on the DeepMind blog days after the
    Gemini 4 Argon launch. It has already taken the top spot on Artificial Analysis's
    headline index at 59, a point above Claude Opus 5.5. Whether that lead holds on
    coding, long-context and agentic work, and at what latency and price, is not yet
    clear.
  sources:
  - https://deepmind.google/blog/gemini-4-carbon-our-next-frontier-model/
  - https://artificialanalysis.ai/models
  card: 'New Google frontier model, straight to AA #1'
- name: GPT-6.1 Terra
  maker: OpenAI
  target: best overall LLM
  released: 2026-10-26
  status: API only
  scored: false
  note: 'A GPT-6.1 variant aimed squarely at computer use, pitched as fast enough
    to put browser and desktop control in everyday hands. The striking part is positioning
    rather than scores: OpenAI frames it as general availability for computer use
    rather than a research preview. No independent numbers on task success, cost per
    completed task or safety under adversarial pages yet.'
  sources:
  - https://openai.com/index/introducing-gpt-6-1-terra
  card: OpenAI's computer-use model, now broadly offered
- name: LFM3-1.7B
  maker: Liquid AI
  target: best small / on-device LLM
  released: 2026-10-23
  status: weights out
  scored: false
  note: The text model at the centre of Liquid's new LFM3 edge family, with GGUF builds
    published alongside the safetensors release and multilingual coverage spanning
    English, Arabic, Chinese and French. It arrives with sibling vision, audio and
    omni 2B variants, which is a broad edge line-up to ship at once. Quality against
    the established sub-3B open models, and real device throughput, remain unverified.
  sources:
  - https://huggingface.co/LiquidAI/LFM3-1.7B
  - https://huggingface.co/LiquidAI/LFM3-1.7B-GGUF
  card: Liquid's 1.7B edge model, GGUF from day one
- name: ERNIE-5.5-Flash-Base
  maker: Baidu
  target: best open-weight LLM
  released: 2026-10-21
  status: weights out
  scored: false
  note: Baidu has released the base (pre-instruction-tuning) weights of its ERNIE
    5.5 Flash mixture-of-experts model, bilingual in English and Chinese, under its
    own licence. Publishing a base checkpoint of a current-generation commercial model
    is unusual and useful for anyone doing their own post-training. Chat behaviour,
    licence restrictions and real-world quality are untested here, and a base model
    will not benchmark well against instruction-tuned rivals without work.
  sources:
  - https://huggingface.co/baidu/ERNIE-5.5-Flash-Base
  card: Baidu opens the ERNIE 5.5 Flash base weights
