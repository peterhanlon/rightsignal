slot: embeddings
category: retrieval-tooling
title: Best text embeddings
question: What is the best text embedding model right now?
criteria:
- RTEB / MTEB retrieval benchmarks
- dimension/cost trade-off
- multilingual coverage
provisional: false
since: 2026-07-16
pick:
  name: Nemotron-3-Embed-8B
  version: ''
  url: https://huggingface.co/nvidia/Nemotron-3-Embed-8B-BF16
  licence: OpenMDW-1.1
  why: 'NVIDIA''s launch materials put Nemotron-3-Embed-8B-BF16 top of the RTEB multilingual
    board as of 16 July 2026, on a headline 78.46 average NDCG@10 across the 16 public
    RTEB tasks its model card actually reports, plus 75.45 on MMTEB Retrieval. The
    card confirms 34 evaluated languages, a 32,768-token maximum sequence length and
    4,096-dimension vectors you can slice to 2,048 or 1,024 and re-normalise, with
    weights under OpenMDW-1.1 and 1B BF16 and NVFP4 checkpoints for cheaper serving.
    Mind the basis before you quote it: the live RTEB(beta) multilingual board lists
    30 tasks over 22 languages, ranks by Borda count of per-task ranks rather than
    by mean score, and has had its private column temporarily removed since January
    2026, so the placing rests on a vendor snapshot of an open-task view.'
caveats: 'Microsoft''s card for harrier-oss-v1-27b claims state-of-the-art on Multilingual
  MTEB v2 at release, with a 74.3 average across a 94-language family (0.6b 69.0,
  270m 66.5), but it gives no task count, no rival scores and no Borda ranking — so
  treat any head-to-head against Tencent''s KaLM-Embedding-Gemma3-12B-2511 as unconfirmed
  rather than settled. That card dates from late March 2026 and the model landed in
  Foundry in April, so pull the live MTEB table before repeating either number. Either
  way an MTEB v2 task mean and our pick''s RTEB NDCG@10 answer different questions:
  one aggregates all task types, the other is retrieval only.'
challengers:
- name: Gemini Embedding 2
  note: Google's Gemini Embedding 2 is natively multimodal, mapping text, images,
    video, audio and documents into one vector space; it went to public preview on
    10 March 2026 and reached general availability on 22 April 2026 through the Gemini
    API, Vertex AI and the Gemini Enterprise Agent Platform. Output defaults to 3,072
    dimensions and is Matryoshka-truncatable from 128 up, with 768, 1,536 and 3,072
    the recommended sizes, over an 8,192-token context, at list pricing of about $0.20
    per million text tokens. It remains API-only, so it is not an option if you need
    weights you can host yourself.
