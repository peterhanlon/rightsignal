slot: tts-open-weight
category: speech
title: Best open-weight TTS
question: What is the best open-weight text-to-speech model right now?
criteria:
- output quality (MOS / arena Elo)
- latency
- licence
- hardware requirements
provisional: false
since: &id001 2026-09-09
pick:
  name: BreezeBlue Breeze TTS 2 Open Weights
  version: ''
  url: https://huggingface.co/BreezeBlue/Breeze-TTS-2
  licence: Apache-2.0 inference code; weights under BreezeBlue research/non-commercial
    licence
  why: Top open-weight model on the Artificial Analysis provider-voice leaderboard
    at 1202 Elo, ninth overall and 82 points clear of the next open-weight model,
    Fish Audio S2 Pro at 1120. BreezeBlue quotes under 40ms time-to-first-audio and
    a 0.32 RTF on a warmed H100, but those numbers come from the --fast-all path,
    which wants about 14.4 GiB and a 24GB card; plain eager inference fits in roughly
    7.7 GiB, so 12GB is the practical floor. English and Chinese only, and the weights
    sit under the BreezeBlue Research and Non-Commercial Licence, so commercial self-hosting
    still needs a separate arrangement.
caveats: 'Open-weight but not open-source: the inference code is Apache-2.0, while
  the weights, derivatives and self-hosted outputs fall under the BreezeBlue Research
  and Non-Commercial Licence, and a paid breezeblue.ai subscription only covers outputs
  from the hosted platform, not anything you generate locally. If you need commercial
  self-hosting, MIT-licensed Ming-3.0-tts (1187 on the provider-voice board) and Fish
  Audio Drama 3 (1275 provider-voice, 1073 controlled-voice) are the stronger fallbacks,
  though Drama 3''s Community Licence v1.0 is only free commercially below US$500k
  annual revenue and grants no rights at all to run it as a hosted service for third
  parties, whatever your revenue; Apache-2.0 Step Audio EditX (1101) remains the no-strings
  option. The standing is board-specific and language-limited too: on the controlled-voice
  arena Breeze scores 1019, fourth among open-weight models behind Drama 3 (1073),
  Ming-3.0-tts (1067) and Drama 3 Preview (1060), and the model speaks English and
  Chinese only.'
challengers:
- name: Fish Audio Drama 3
  note: 'Currently the top open-weight model on both Artificial Analysis boards —
    1275 on provider-voice and 1073 on controlled-voice — ahead of Drama 3 Preview,
    Ming-3.0-tts and Breeze TTS 2. Its Community Licence v1.0 is free commercially
    below US$500k annual revenue, but it grants no rights to offer a hosted service
    to third parties at any revenue level, so an API product still needs a separate
    agreement with Fish Audio. Hardware is the real cost: it is a 35B-parameter mixture-of-experts
    model with about 3B active per token, and launch-day self-hosting reports cluster
    around 39-48 GB of VRAM, or roughly 32 GB on community 4-bit builds, so benchmark
    on your own cards before committing.'
- name: StepFun StepAudio 2.5 TTS (Aug 2026)
  note: Now trails the pick on the Artificial Analysis provider-voice board, 1214
    to 1228 — 18th against 13th — on the board's current scale. It stays proprietary
    and API-only on StepFun's platform at about $85 per 1M characters with no weights
    published, so it is not an option for self-hosters either way. StepFun's open-weight
    audio line remains Step-Audio-EditX and Step-Audio-2-mini.
