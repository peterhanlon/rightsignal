slot: tts-open-weight
category: speech
title: Best open-weight TTS
question: What is the best open-weight text-to-speech model right now?
criteria:
- output quality (MOS / arena Elo)
- latency
- licence
- hardware requirements
provisional: false
since: &id001 2026-09-09
pick:
  name: BreezeBlue Breeze TTS 2 Open Weights
  version: ''
  url: https://huggingface.co/BreezeBlue/Breeze-TTS-2
  licence: Apache-2.0 inference code; weights under BreezeBlue research/non-commercial
    licence
  why: Top open-weight model on the Artificial Analysis provider-voice leaderboard
    at 1202 Elo, ninth overall and 82 points clear of the next open-weight model,
    Fish Audio S2 Pro at 1120. BreezeBlue quotes under 40ms time-to-first-audio and
    a 0.32 RTF on a warmed H100, but those numbers come from the --fast-all path,
    which wants about 14.4 GiB and a 24GB card; plain eager inference fits in roughly
    7.7 GiB, so 12GB is the practical floor. English and Chinese only, and the weights
    sit under the BreezeBlue Research and Non-Commercial Licence, so commercial self-hosting
    still needs a separate arrangement.
caveats: 'Open-weight but not open-source: the inference code is Apache-2.0, but the
  weights, derivatives and self-hosted outputs fall under the BreezeBlue Research
  and Non-Commercial Licence, and a paid breezeblue.ai subscription only covers outputs
  from the hosted API — not anything you generate locally. That keeps Apache-2.0 Step
  Audio EditX (1099 Elo on the same board) the pragmatic fallback if you need commercial
  self-hosting. The lead is also board-specific and language-limited: on Artificial
  Analysis''s controlled-voices arena Breeze ranks third among open-weight models
  at 1002, behind Mistral''s Voxtral TTS at 1010, and the model speaks English and
  Chinese only.'
challengers:
- name: StepFun StepAudio 2.5 TTS (Aug 2026)
  note: Leads the pick 1207 to 1202 on the Artificial Analysis provider-voice board,
    seventh overall against ninth. It is proprietary and API-only on StepFun's platform
    at about $85 per 1M characters, though, with no weights published, so it doesn't
    displace the pick for self-hosters. StepFun's open-weight audio line remains Step-Audio-EditX
    and Step-Audio-2-mini.
