pick:
  name: Fish Audio S2 Pro
  version: ''
  url: https://huggingface.co/fishaudio/s2-pro
  licence: Fish Audio Research License (non-commercial)
  why: 'Open-sourced on 9 March 2026: a ~4.4B dual-autoregressive model trained on
    10M+ hours across 80+ languages, currently the highest-ranked open-weights model
    on the Artificial Analysis TTS leaderboard, with a production SGLang streaming
    engine (~100ms to first audio on one H200).'
caveats: 'Open-weight but not open-source: the Fish Audio Research License permits
  research and non-commercial use free of charge, and any commercial deployment needs
  a separate licence from Fish Audio, which keeps Apache-licensed rivals relevant
  for self-hosters. The downloadable weights are also a generation behind the hosted
  product — S2.1 Pro arrived on 23 June 2026 as an API-only model, free under a fair-use
  policy, with ~70ms time-to-first-audio and a 61% win rate over S2 Pro in Fish''s
  own blind listening tests, and no S2.1 checkpoints have been published on the fishaudio
  Hugging Face org. Budget for an H200-class GPU if you want the quoted streaming
  numbers locally.'
challengers:
- name: Step-Audio-EditX
  note: Apache-2.0, 13 Elo behind on the same arena, runs on a single 12-16GB GPU
    — the pick if commercial licensing is a hard requirement.
