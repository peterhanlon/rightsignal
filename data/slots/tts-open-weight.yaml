slot: tts-open-weight
category: speech
title: Best open-weight TTS
question: What is the best open-weight text-to-speech model right now?
criteria:
- output quality (MOS / arena Elo)
- latency
- licence
- hardware requirements
provisional: false
since: 2026-03-09
pick:
  name: Fish Audio S2 Pro
  version: ''
  url: https://huggingface.co/fishaudio/s2-pro
  licence: Fish Audio Research License (non-commercial)
  why: 'Open-sourced on 9 March 2026: a ~4.4B dual-autoregressive model trained on
    10M+ hours across 80+ languages, currently the highest-ranked open-weights model
    on the Artificial Analysis TTS leaderboard, with a production SGLang streaming
    engine (~100ms to first audio on one H200).'
caveats: 'Open-weight but not open-source: the Fish Audio Research License permits
  research and non-commercial use free of charge, and any commercial deployment needs
  a separate licence from Fish Audio, which keeps the Apache-2.0-coded Step-Audio-EditX
  relevant for self-hosters. The downloadable weights are also a generation behind
  the hosted product — S2.1 Pro arrived on 23 June 2026 as an API-only model with
  roughly 70ms time-to-first-audio on a single request (about 90ms on standard calls)
  and a claimed 61% win rate over S2 Pro, and no S2.1 checkpoints have appeared on
  the fishaudio Hugging Face org. The s2.1-pro-free tier is currently listed at $0.00
  with no hard character cap under a Fair Use Policy, but Fish still frames it as
  an initial period with advance notice before changes, so don''t build a budget on
  it; and budget for an H200-class GPU if you want the quoted 0.195 RTF and ~100ms
  first-audio figures locally.'
challengers:
- name: BreezeBlue Breeze TTS 2 Open Weights
  note: 'Now #7 overall on the Artificial Analysis provider-voice leaderboard at 1215
    Elo and top of the open-weight field, well clear of the pick at 1128, which has
    slipped to 25th. The weights went up on Hugging Face on 25 August 2026: inference
    code is Apache 2.0, but the checkpoints carry BreezeBlue''s research-and-non-commercial
    licence, so it is no easier to ship commercially than the pick. BreezeBlue quotes
    under 40ms time-to-first-audio and 0.32 RTF on a warmed-up H100, with roughly
    7.7 GiB for eager inference on a 12GB card, though it covers English and Chinese
    only.'
- name: Step-Audio-EditX
  note: It sits at 1,104 Elo on the Artificial Analysis provider-voice leaderboard,
    24 points behind the pick at 1,128 and well behind Breeze TTS 2 at 1,215. StepFun
    licenses the repository code under Apache 2.0, but the Hugging Face weights repo
    carries no licence file or metadata of its own, so read that gap carefully before
    shipping commercially — it is still the least restrictive of the three on paper.
    It runs on a single NVIDIA GPU with 12GB VRAM (StepFun calls 12GB the critical
    value and suggests 16GB to be safe, tested on an L40S), with AWQ 4-bit checkpoints
    for tighter budgets.
