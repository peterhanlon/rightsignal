provisional: false
since: 2026-03-09
pick:
  name: Fish Audio S2 Pro
  version: ''
  url: https://huggingface.co/fishaudio/s2-pro
  licence: Fish Audio Research License (non-commercial)
  why: 'Open-sourced on 9 March 2026: a ~4.4B dual-autoregressive model trained on
    10M+ hours across 80+ languages, currently the highest-ranked open-weights model
    on the Artificial Analysis TTS leaderboard, with a production SGLang streaming
    engine (~100ms to first audio on one H200).'
caveats: 'Open-weight but non-commercial: the model card permits research and non-commercial
  use free of charge, and commercial deployment needs a separate licence from Fish
  Audio, which keeps Apache-licensed rivals relevant for self-hosters. The open/closed
  gap is real too - on 16 August 2026 S2 Pro sat 24th overall at 1,124 Elo, about
  115 behind the closed leader. And Fish''s own newer S2.1 Pro (June 2026, 1,142 Elo,
  17th) is API-only, so the weights you can download are a generation behind what
  the vendor now sells.'
challengers:
- name: Step-Audio-EditX
  note: Apache-2.0, 13 Elo behind on the same arena, runs on a single 12-16GB GPU
    — the pick if commercial licensing is a hard requirement.
