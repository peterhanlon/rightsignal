slot: tts-open-weight
category: speech
title: Best open-weight TTS
question: What is the best open-weight text-to-speech model right now?
criteria:
- output quality (MOS / arena Elo)
- latency
- licence
- hardware requirements
provisional: false
since: &id001 2026-09-09
pick:
  name: BreezeBlue Breeze TTS 2 Open Weights
  version: ''
  url: https://huggingface.co/BreezeBlue/Breeze-TTS-2
  licence: Apache-2.0 inference code; weights under BreezeBlue research/non-commercial
    licence
  why: Top open-weight model on the Artificial Analysis provider-voice leaderboard
    at 1202 Elo, ninth overall and 82 points clear of the next open-weight model,
    Fish Audio S2 Pro at 1120. BreezeBlue quotes under 40ms time-to-first-audio and
    a 0.32 RTF on a warmed H100, but those numbers come from the --fast-all path,
    which wants about 14.4 GiB and a 24GB card; plain eager inference fits in roughly
    7.7 GiB, so 12GB is the practical floor. English and Chinese only, and the weights
    sit under the BreezeBlue Research and Non-Commercial Licence, so commercial self-hosting
    still needs a separate arrangement.
caveats: 'Open-weight but not open-source: the inference code is Apache-2.0, while
  the weights, derivatives and self-hosted outputs fall under the BreezeBlue Research
  and Non-Commercial Licence, and a paid breezeblue.ai subscription only covers outputs
  from the hosted platform, not anything you generate locally. On the current provider-voice
  board Breeze sits third among open-weight models at 1229, behind Fish Audio Drama
  3 (1275) and Drama 3 Preview (1239), so if you need commercial self-hosting the
  MIT-licensed Ming-3.0-tts (1182) is the cleanest route, while Drama 3''s Community
  Licence v1.0 is only free commercially below US$500k annual revenue and grants no
  rights to offer it to third parties as a TTS, voice-cloning or inference service,
  whatever your revenue. Step Audio EditX (Mar 2026) is the lighter fallback at 1100,
  and Breeze itself speaks English and Chinese only.'
challengers:
- name: Fish Audio Drama 3
  note: 'Top open-weight model on the Artificial Analysis provider-voice arena at
    1275–1277, ahead of Drama 3 Preview (1239) and the former pick Breeze TTS 2 (1229),
    and inside the overall top ten at #8. Its Community Licence v1.0 is more permissive
    than Breeze''s research-only weights, but it grants no right to resell the model
    as a hosted TTS or inference service. The catch is hardware: a 35B MoE with ~3B
    active per token, around 40 GB of weights and self-hosting guidance near 48 GB
    of VRAM.'
- name: StepFun StepAudio 2.5 TTS (Aug 2026)
  note: Still trails the pick on the Artificial Analysis provider-voice board, which
    currently has Breeze TTS 2 at 1229 on its re-based scale, with Fish Audio Drama
    3 (1275) and Drama 3 Preview (1239) ahead of both. It stays proprietary and API-only
    on StepFun's platform with no weights published, so it is not an option for self-hosters
    either way. StepFun's open-weight audio line remains Step-Audio-EditX, which sits
    at 1100 among open weights on the same board, plus Step-Audio-2-mini.
