slot: stt-open-weight
category: speech
title: Best open-weight STT
question: What is the best open-weight speech-to-text model right now?
criteria:
- WER on independent leaderboards
- throughput
- licence
- language coverage
provisional: false
since: 2026-06-22
pick:
  name: ARK-ASR-3B
  version: ''
  url: https://huggingface.co/Audio8/ARK-ASR-3B
  licence: Apache-2.0
  why: Number one on the Hugging Face Open ASR Leaderboard at 4.76% average WER, with
    19-language coverage and a permissive Apache-2.0 licence — a combination Whisper
    large-v3 and the Parakeet/Canary line no longer match on accuracy. Weights landed
    on 22 June and it has led the board since release.
caveats: NVIDIA Parakeet-TDT-0.6B-v3 remains the throughput king where speed matters
  more than the last point of WER. Dates for the pedants — paper 27 May, weights 22
  June; the model card self-reports 5.04% on a smaller subset, 4.76% is the live
  leaderboard average.
challengers:
- name: MOSS-Transcribe-preview-2B
  note: 4.87% WER and Apache-2.0, but English-only and RL-tuned on the leaderboard's
    training splits — leaderboard-fitted.
