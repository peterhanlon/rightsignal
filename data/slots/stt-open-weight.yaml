slot: stt-open-weight
category: speech
title: Best open-weight STT
question: What is the best open-weight speech-to-text model right now?
criteria:
- WER on independent leaderboards
- throughput
- licence
- language coverage
provisional: false
since: 2026-06-22
pick:
  name: ARK-ASR-3B
  version: ''
  url: https://huggingface.co/Audio8/ARK-ASR-3B
  licence: Apache-2.0
  why: 'Tops the Hugging Face Open ASR Leaderboard''s English mean-WER table at 4.76%,
    narrowly ahead of MOSS-Transcribe-preview-2B on 4.87% and well clear of Cohere
    Transcribe on 5.42%, with 19-language coverage and a genuinely permissive Apache-2.0
    licence. The Parakeet and Canary entries on the same board sit at 6.05% and 6.35%,
    so accuracy is the reason to take it — nothing else. Read the ranking as public
    English short-form only: the leaderboard''s private accent sets are excluded from
    the macroaverage by default and reshuffle the top when switched on.'
caveats: 'NVIDIA''s Parakeet-TDT-0.6B-v3 is still the sensible choice where throughput
  decides the invoice, at roughly RTFx 3300 across 25 European languages against ARK''s
  490.98 — though NVIDIA quotes its English-only parakeet-tdt-0.6b-v2 marginally higher
  again, and either way you are paying about 1.5 WER points for the speed. Dates for
  the pedants: the OPD paper went up on arXiv on 27 May 2026; treat the weight-drop
  date as unconfirmed, since the project''s own changelog records only the 0.6B release
  and stops at 28 May. The card''s 5.04% and the board''s 4.76% cover the same seven
  English sets — TED-LIUM is excluded from the leaderboard run — so the difference
  is not down to dataset coverage; take the card figure as the conservative one.'
challengers:
- name: MOSS-Transcribe-preview-2B
  note: 4.87% WER and Apache-2.0, but English-only and RL-tuned on the leaderboard's
    training splits — leaderboard-fitted.
- name: MOSS-Transcribe-Diarize
  note: The preview's production sibling at 0.9B — a claimed 5.17% mean WER on the
    same evaluation, built-in diarisation, and the adoption its sibling never found,
    at over 200k downloads.
