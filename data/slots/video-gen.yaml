pick:
  name: Alibaba Wan 3.0
  version: ''
  url: https://huggingface.co/Wan-AI
  licence: not verified in dossier — check Alibaba's release terms
  why: 'Wan 3.0 is #1 on Artificial Analysis''s text-to-video with-audio board (1175,
    with the previous pick, Gemini Omni Flash 1.1, tenth on 1128) and #1 on the video
    editing board (1196), though on the silent text-to-video board it is only fourth
    (1133) behind HeyGen Video 1 (1143). Alibaba''s Model Studio docs confirm 2-30
    second clips in a single job at up to 1080p and 30fps, with dialogue, sound effects
    and music generated natively in the same pass. It is hosted-only with no open
    weights, so confirm Alibaba Cloud''s terms before commercial work.'
caveats: 'The lead is narrower than it looks: Wan 3.0 tops text-to-video with audio
  (1175) and video editing (1196) on Artificial Analysis, but sits fourth on the silent
  text-to-video board (1133, behind HeyGen Video 1 on 1143) and ninth on image-to-video
  with audio (1111), where Dreamina Seedance 2.5 leads on 1153. Note the boards were
  re-based for v2.1, with the scale pinned so Kling 3.0 1080p (Pro) sits at 1000,
  so Elo figures quoted earlier this year are not comparable. There are no open weights
  either: Wan 3.0 is hosted on Alibaba Cloud Model Studio and listed at $12 per minute,
  so the Wan-AI Hugging Face org carries only the older Wan 2.x releases.'
