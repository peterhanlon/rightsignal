pick:
  name: Gemini Omni Flash
  version: ''
  url: https://deepmind.google/models/gemini-omni/
  licence: proprietary
  why: Leads arena.ai's Text-to-Video Arena at 1,512 with FLUX 3 Video eighteen points
    back, and tops Artificial Analysis's text-to-video board at 1,323 with MiniMax
    H3 twenty points behind. The catch is audio — on AA's with-audio table Alibaba's
    Wan 3.0 now leads at 1,247 with the pick second on 1,239. Its differentiator is
    conversational multi-turn editing, where each change builds on the last while
    holding character and scene consistency, with native synced audio on every clip.
caveats: 'A hold under real pressure: Wan 3.0 has taken the top of the with-audio
  text-to-video table, and arena.ai''s Image-to-Video Arena has MiniMax H3 first at
  1,489. Output is also capped at 3-10 seconds of 720p, where MiniMax H3 ships 15
  seconds at 2K, FLUX 3 Video does 20 seconds with native audio, and Seedance 2.5
  claims 30 seconds natively. Seedance 2.5 still carries no arena score on either
  AA board, so treat its launch claims as unverified.'
challengers:
- name: Alibaba Wan 3.0
  note: 'New #1 on Artificial Analysis''s with-audio text-to-video board at 1,247,
    eight points ahead of Gemini Omni Flash on 1,239 — a narrow, single-board lead
    with no independent read yet on clip length or image-to-video.'
- name: MiniMax H3 (Hailuo 3.0)
  note: Second to the pick on AA's text-to-video board at 1,303 and third with audio
    at 1,228 — and it leads arena.ai's Image-to-Video Arena outright at 1,489, with
    15-second 2K clips and weights on Hugging Face, rare at this rank. The open release
    is the 768p base, though, and the community licence excludes the US, EU and UK,
    so for most Western readers it is effectively API-only.
- name: FLUX-3 Video
  note: Black Forest Labs' first video model sits second on arena.ai's Text-to-Video
    Arena at 1,494, eighteen points behind the pick, and sixth on the Image-to-Video
    Arena at 1,449. Far from skipping the extras, FLUX 3 generates up to 20 seconds
    of video with a synchronised soundtrack rendered in the same pass, released at
    720p and 1080p. These are crowd-vote scores from a single arena, so cross-check
    on your own shots before rebuilding a pipeline around it.
