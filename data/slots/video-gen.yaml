pick:
  name: Alibaba Wan 3.0
  version: ''
  url: https://huggingface.co/Wan-AI
  licence: not verified in dossier — check Alibaba's release terms
  why: 'Wan 3.0 is #1 on Artificial Analysis''s AA-Video-T2V v2.1 with-audio board
    (1175, just three Elo clear of Utopai X on 1172, with the confidence intervals
    overlapping) and #1 on the video editing board (1196), where Google''s newer Gemini
    Omni Flash 1.2 is the nearest challenger on 1164. Alibaba''s Model Studio documentation
    confirms clips of up to 30 seconds in a single job at 480p, 720p or 1080p, with
    voice dialogue, ambient sound effects and background music generated natively
    rather than dubbed in post. It is hosted-only with no Wan 3.0 weights on the Wan-AI
    Hugging Face org, so check Alibaba Cloud''s terms before commercial work.'
caveats: 'The lead is narrower than it looks: Wan 3.0 tops text-to-video with audio
  (1175) by only three Elo over Utopai X (1172), with the two confidence intervals
  overlapping, and tops video editing (1196), but it has slipped to fifth on the silent
  text-to-video board (1136, behind HeyGen Video 1 on 1146, MiniMax H3 Max, FLUX 3
  Max and Utopai X) and sits eleventh on image-to-video with audio (1109), where Dreamina
  Seedance 2.5 leads on 1161. The boards were re-based for v2.1, with the scale pinned
  so Kling 3.0 1080p (Pro) sits at exactly 1000, so Elo figures quoted earlier this
  year are not comparable. There are no open weights - the Wan-AI Hugging Face org
  still stops at the Wan 2.x releases - and the $12 per minute Artificial Analysis
  lists is the 1080p tier at $0.20 per second; 480p runs at $0.05 per second, and
  non-Singapore regions are billed lower.'
