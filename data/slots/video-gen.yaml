pick:
  name: Alibaba Wan 3.0
  version: ''
  url: https://huggingface.co/Wan-AI
  licence: not verified in dossier — check Alibaba's release terms
  why: 'Wan 3.0 is #1 on Artificial Analysis''s text-to-video with-audio board (1172,
    with the previous pick, Gemini Omni Flash 1.1, twelfth on 1127) and #1 on the
    video editing board (1192), while on the silent text-to-video board it sits second
    (1134) behind HeyGen Video 1 (1144). Alibaba''s Model Studio listings confirm
    clips of up to 30 seconds in a single job from 480p to 1080p, with dialogue, sound
    effects and music generated natively in the same pass. It is hosted-only with
    no open weights, so confirm Alibaba Cloud''s terms before commercial work.'
caveats: 'The lead is narrower than it looks: Wan 3.0 tops text-to-video with audio
  (1172) and video editing (1192) on Artificial Analysis, but sits second on the silent
  text-to-video board (1134, behind HeyGen Video 1 on 1144) and tenth on image-to-video
  with audio (1109), where Dreamina Seedance 2.5 leads on 1158. Note the boards were
  re-based for v2.1, with the scale pinned so Kling 3.0 1080p (Pro) sits at 1000,
  so Elo figures quoted earlier this year are not comparable. There are no open weights
  either: Wan 3.0 is hosted on Alibaba Cloud Model Studio and listed at $12 per minute,
  so the Wan-AI Hugging Face org carries only the older Wan 2.x releases.'
