slot: video-gen
category: image-video
title: Best video generation
question: What is the best AI video generation model right now?
criteria:
- visual quality
- character consistency
- native audio
- clip length
provisional: false
since: 2026-06-30
pick:
  name: Gemini Omni Flash
  version: ''
  url: https://deepmind.google/models/gemini-omni/
  licence: proprietary
  why: 'Google''s own material still frames Omni Flash as the video-first, natively
    multimodal option: the model card now covers both the original Omni Flash and
    the newer Gemini Omni 1.1 Flash, and outputs are high-resolution video with audio
    rather than silent clips needing a separate pass. The differentiator remains step-by-step
    conversational editing, where each turn builds on the last — available in the
    Gemini app, Google Flow and YouTube, and buildable in AI Studio against gemini-omni-1.1-flash;
    there is no product called the Interactions API. Temper the consistency pitch:
    Google''s own known limitations say holding complete consistency across edits
    is still a challenge, so multi-turn work needs checking shot by shot.'
caveats: 'A hold under real pressure rather than a sweep: on Artificial Analysis''s
  with-audio tables the pick is level with or behind Wan 3.0 on text-to-video and
  behind fal''s post-trained Minimax H3 Max on image-to-video, so audio remains the
  weakest part of the case. Clip length is the other limit — rivals quote longer single-pass
  outputs, and Google''s standard output is 720p with 1080p or 4K arriving via a separate
  upscale, so "15 seconds at 2K" claims are not like-for-like. Google''s own model
  card also lists complete consistency across edits as an open limitation, which matters
  given we sell this pick on multi-turn editing.'
challengers:
- name: Alibaba Wan 3.0
  note: 'Now clear #1 on Artificial Analysis''s text-to-video board at 1242 Elo, five
    points above the pick''s 1237 — a lead that has widened across three successive
    reads (1239 level, then 1240 v 1239). The pick still tops AA''s no-audio text-to-video
    and image-to-video boards, and there is still no independent read on Wan 3.0''s
    clip length or character consistency, two of our four criteria.'
- name: Fal MiniMax H3 Max (post-trained by fal)
  note: Third on AA's with-audio text-to-video board on 1,235, two points behind the
    pick (1,237) and six behind Wan 3.0 (1,241), with a ranked range of 1-4 — a statistical
    tie at the top rather than a lead. It has gone one better on image-to-video, where
    it now leads AA's with-audio board on 1,202, ahead of Dreamina Seedance 2.0 720p
    (1,190), MiniMax H3 (1,185) and the pick (1,179). Still no independent read on
    clip length or character consistency.
- name: MiniMax H3 (Hailuo 3.0)
  note: Second to the pick on AA's no-audio text-to-video board on 1,301 and now fourth
    with audio on 1,227, yet still AA's top open-weights model on both, with 15-second
    2K clips and weights on Hugging Face — rare at this rank. On image-to-video it
    is second without audio (1,347 to the pick's 1,365) and third with audio (1,185),
    behind fal's post-trained Minimax H3 Max (1,202) and Dreamina Seedance 2.0 720p
    (1,190). The open release is the 768p base, with the 2K regeneration stage held
    back, and the community licence's excluded territories are the EU, UK, US and
    South Korea, though MiniMax runs an application form for those regions.
