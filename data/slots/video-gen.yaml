pick:
  name: Alibaba Wan 3.0
  version: ''
  url: https://huggingface.co/Wan-AI
  licence: not verified in dossier — check Alibaba's release terms
  why: 'Wan 3.0 is #1 on Artificial Analysis''s AA-Video-T2V v2.1 with-audio board
    (1175, five Elo clear of Utopai X on 1170, with the confidence intervals overlapping)
    and #1 on AA-Video-Editing v1.1 (1197), where Google''s newer Gemini Omni Flash
    1.2 is the nearest challenger on 1166. Alibaba''s Model Studio documentation confirms
    clips of up to 30 seconds in a single job at 480p, 720p or 1080p, with dialogue,
    sound effects and music generated in the same pass rather than dubbed in post.
    It is hosted-only, with no Wan 3.0 weights on the Wan-AI Hugging Face org, so
    check Alibaba Cloud''s terms before any commercial work.'
caveats: 'The lead is narrower than it looks: Wan 3.0 tops text-to-video with audio
  on 1175, only five Elo above Utopai X on 1170 with the two intervals overlapping,
  and tops video editing on 1197, but it has dropped out of the top five on the silent
  text-to-video board - HeyGen Video 1 leads that one on 1149, ahead of FLUX 3 Max,
  MiniMax H3 Max, Hyperflow H3 and Utopai X - and sits twelfth on image-to-video with
  audio (1110), where Dreamina Seedance 2.5 leads on 1162. The v2.1 boards are re-based
  with Kling 3.0 1080p (Pro) pinned at exactly 1000, so Elo figures quoted earlier
  this year are not comparable. There are still no open weights - Alibaba''s open
  Wan line stops at the 2.x releases - and the $12 per minute Artificial Analysis
  lists is the 1080p tier at $0.20 per second; 480p runs at $0.05 per second, with
  lower rates in some regions.'
