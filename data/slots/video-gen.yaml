provisional: false
since: 2026-06-30
pick:
  name: Gemini Omni Flash
  version: ''
  url: https://deepmind.google/models/gemini-omni/
  licence: proprietary
  why: 'Tops arena.ai''s Text-to-Video Arena on 1,512, with an updated FLUX 3 Video
    build sixteen points back on 1,496, and leads Artificial Analysis''s no-audio
    text-to-video board on 1,322, nineteen points clear of MiniMax H3 on 1,303. Audio
    is the soft spot: on AA''s with-audio table Alibaba''s Wan 3.0 is first on 1,244
    with the pick second on 1,238. The differentiator remains conversational multi-turn
    editing, where each change builds on the last while holding character and scene
    consistency, with native synced audio on every clip.'
caveats: 'A hold under real pressure: Wan 3.0 has taken the top of AA''s with-audio
  text-to-video table on 1,244 to the pick''s 1,238, and on AA''s image-to-video board
  the pick only leads without audio (1,366), dropping to third with audio behind Dreamina
  Seedance 2.0 (1,191) and MiniMax H3 (1,184). Clip length is the other limit — MiniMax
  H3 runs to 15 seconds at 2K, FLUX 3 Video to 20 seconds at 720p and 1080p with native
  audio, and Seedance 2.5 claims 30 seconds in a single pass. Seedance 2.5 still carries
  no score on either AA board, so treat its launch claims as unverified.'
challengers:
- name: Alibaba Wan 3.0
  note: 'Nominally #1 on Artificial Analysis''s with-audio text-to-video board on
    1,244, six points ahead of Gemini Omni Flash on 1,238 — but AA gives it a ranked
    range of 1-2, so on current votes it is a statistical tie, not a clear lead. It
    has around 5,679 votes to the pick''s 16,160, and AA still shows its API pricing
    as coming soon. There is no independent read yet on clip length or image-to-video.'
- name: MiniMax H3 (Hailuo 3.0)
  note: 'Second to the pick on AA''s no-audio text-to-video board at 1,303 and third
    with audio at 1,228, and AA''s top open-weights model on both, with 15-second
    2K clips and weights on Hugging Face — rare at this rank. On image-to-video it
    is second rather than first: AA has it behind Gemini Omni Flash without audio
    (1,346 v 1,366) and behind Dreamina Seedance 2.0 with audio (1,184 v 1,191). The
    open release is the 768p base, with the 2K regeneration stage not open-sourced,
    and the community licence''s excluded territories are the EU, UK, US and South
    Korea, though MiniMax runs an application form for those regions.'
- name: FLUX-3 Video
  note: Black Forest Labs' first video model sits second on arena.ai's Text-to-Video
    Arena at 1,494, eighteen points behind the pick, and sixth on the Image-to-Video
    Arena at 1,449. Far from skipping the extras, FLUX 3 generates up to 20 seconds
    of video with a synchronised soundtrack rendered in the same pass, released at
    720p and 1080p. These are crowd-vote scores from a single arena, so cross-check
    on your own shots before rebuilding a pipeline around it.
