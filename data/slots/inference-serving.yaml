slot: inference-serving
category: retrieval-tooling
title: Best inference serving
question: What is the best way to serve open-weight LLMs in production right now?
criteria:
- throughput benchmarks
- day-0 model support
- ecosystem
- operational maturity
provisional: false
since: 2023-06-20
pick:
  name: vLLM
  version: ''
  url: https://github.com/vllm-project/vllm
  licence: Apache-2.0
  why: 'Still the default production serving engine on ecosystem weight nobody matches:
    5.6M+ monthly pip installs, 86K+ GitHub stars, 1000+ supported model architectures
    and 600+ accelerator types, under PyTorch Foundation governance with a two-week
    release train gated on CI, nightly performance benchmarks and accuracy evals.
    Day-0 support for new frontier weights is routine — Qwen3.8-2.4T-A95B landed on
    release day in August 2026. On like-for-like 70B serving the throughput race is
    effectively a tie (SGLang edged it by 2.5-4.6% on H100 unique-prompt traffic in
    March 2026 testing), so pick vLLM for breadth, hardware coverage and release discipline
    rather than raw speed.'
caveats: Close to a two-horse race — SGLang leads shared-prefix chat, agent and RAG
  workloads by ~29% on 8B-class models via RadixAttention.
challengers:
- name: SGLang
  note: Near-parity overall and faster on agentic/structured workloads, with major
    production adoption (xAI, AMD, LinkedIn, Cursor).
history: []
last_reviewed: 2026-08-15
