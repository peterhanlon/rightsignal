slot: inference-serving
category: retrieval-tooling
title: Best inference serving
question: What is the best way to serve open-weight LLMs in production right now?
criteria:
- throughput benchmarks
- day-0 model support
- ecosystem
- operational maturity
provisional: false
since: 2023-06-20
pick:
  name: vLLM
  version: ''
  url: https://github.com/vllm-project/vllm
  licence: Apache-2.0
  why: The last like-for-like 70B H100 comparison (Spheron, March 2026, Llama 3.3
    70B FP8) put SGLang just 2.5-4.6% ahead of vLLM on unique-prompt traffic. That
    run used vLLM v0.18.0 on the legacy model runner, before Model Runner V2 became
    the default for dense models in v0.25.0 in July 2026, so it no longer reflects
    what ships by default. Pick vLLM for breadth, hardware coverage and release discipline
    rather than for any current throughput number.
caveats: 'Less of a two-horse race than it looks: SGLang leads shared-prefix chat,
  agent and RAG traffic by roughly 29% on 8B-class models thanks to RadixAttention,
  while TensorRT-LLM led the same March 2026 H100 70B run by 8-13% at 1-50 concurrent
  requests and about 16% at 100, once its engine was compiled. Measure your own prefix
  overlap before committing, and re-run on current releases — that run used vLLM v0.18.0
  on the legacy model runner, before Model Runner V2 became the default in v0.25.0.'
challengers:
- name: SGLang
  note: Near-parity overall and faster on agentic/structured workloads, with major
    production adoption (xAI, AMD, LinkedIn, Cursor).
history: []
last_reviewed: 2026-08-28
