pick:
  name: GPT Image 2.6 Sunburst (max)
  version: ''
  url: https://developers.openai.com/api/docs/models/gpt-image-2.6-sunburst
  licence: proprietary
  why: Tops Artificial Analysis's text-to-image board on 1,263 from 5,421 votes, 33
    clear of GPT-Image-2.5-Sunburst on 1,230. On AA's editing board it is second on
    1,211 from 6,600 votes, a statistical tie with Microsoft's newly released MAI-Image-2.7
    on 1,215. Generally available at $210.72 per 1,000 images, the same as the 2.5
    variants it displaces; Arena remains the holdout, rating only the Medium tier,
    where 2.5 Sunburst still leads it on both text-to-image (1,429 to 1,412) and single-image
    edit (1,519 to 1,481).
caveats: 'The pick only clearly leads one board: on Artificial Analysis''s editing
  board it is second on 1,211, a statistical tie with MAI-Image-2.7 on 1,215, and
  that rival costs $34.82 per 1,000 images against $210.72 here. Arena rates only
  the Medium tier of 2.6, and there GPT-Image-2.5 Sunburst still leads both text-to-image
  (1,429) and single-image edit (1,519), so the 2.6 upgrade is not yet proven at like-for-like
  settings. Anyone still on GPT Image 2 (high) has no reason to stay: it has slipped
  to thirteenth on AA''s editing board on 1,139 while costing $211.00 per 1,000 images.'
