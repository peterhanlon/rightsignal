pick:
  name: GPT Image 2
  version: ''
  url: https://developers.openai.com/api/docs/models/gpt-image-2
  licence: proprietary
  why: 'Still top of both Arena boards: #1 on text-to-image at 1382, 50 clear of MAI-Image-2.6
    on 1332, and #1 on single-image edit at 1461, 22 clear of MAI-Image-2.6 and Grok
    Imagine Image 2.0 (low), which are level on 1439. It also leads Artificial Analysis''s
    text-to-image arena at 1,172, 27 ahead of MAI-Image-2.6 and 45 ahead of Reve 2.1,
    though on that site''s editing arena it has slipped to third at 1,117, behind
    MAI-Image-2.6 (1,129) and MAI-Image-2.6-Flash (1,120). It has held the generation
    crown since its 21 April launch, on the strength of prompt adherence, photorealism
    and text rendering.'
caveats: 'Editing is where the ground has shifted: on Arena''s single-image edit board
  GPT Image 2 (medium) is now third on 1461, behind GPT-Image-2.5-Sunburst (1520)
  and GPT-Image-2.5-Flare (1491), with Grok Imagine Image 2.0 (low) fourth on 1439
  and MAI-Image-2.6 fifth on 1434. Artificial Analysis''s editing arena tells a similar
  story, putting GPT Image 2 (high) second on 1,117 just behind MAI-Image-2.6 on 1,122,
  with Muse Image (1,105) and MAI-Image-2.6-Flash (1,104) close behind. It is also
  by some distance the dearest of the leaders at $211 per 1,000 images on Artificial
  Analysis''s pricing, against $108.50 for MAI-Image-2.5-Pro, $67 for Nano Banana
  2 and $38.90 for MAI-Image-2.6.'
challengers:
- name: MAI-Image-2.6 (preview)
  note: Second on Artificial Analysis's text-to-image arena at 1,149, 29 behind GPT
    Image 2 (high) on 1,178, and it now leads that site's image-editing arena at 1,122,
    a slim 5 ahead of GPT Image 2 (high) on 1,117. On Arena it is fourth in text-to-image
    on 1331 and fifth in single-image edit on 1434, behind Grok Imagine Image 2.0
    (low) on 1439 and both GPT-Image-2.5 models. It went to public preview on Microsoft
    Foundry in early September and Artificial Analysis lists it at $38.90 per 1,000
    images, so it remains much the cheaper buy.
