pick:
  name: GPT Image 2
  version: ''
  url: https://developers.openai.com/api/docs/models/gpt-image-2
  licence: proprietary
  why: 'Top of both Arena boards: #1 on text-to-image at 1381 Elo, 45 clear of MAI-Image-2.6
    (preview), and #1 on single-image edit at 1463, 24 ahead of Grok Imagine Image
    2.0 (low). It also leads Artificial Analysis''s text-to-image arena at 1,369,
    about 48 ahead of Reve 2.1, though on that site''s image-editing arena it is only
    third at 1,256, behind MAI-Image-2.5-Pro at 1,272 and Reve 2.1 at 1,264. It has
    held the top since its 21 April launch, on the strength of thinking-mode reasoning
    before generation, improved multilingual text rendering and more reliable instruction-following.'
caveats: 'Editing is the closest call: on Artificial Analysis''s image-editing arena
  GPT Image 2 is third at 1,256, behind MAI-Image-2.5-Pro at 1,272 and Reve 2.1 at
  1,264, even though it still tops Arena''s edit board at 1463 from Grok Imagine Image
  2.0 (low) at 1439. It is also the dearest of the leaders at about $211 per 1,000
  images on Artificial Analysis''s pricing, against $108.50 for MAI-Image-2.5-Pro,
  $67 for Nano Banana 2 and $48 for MAI-Image-2.5. Treat the challenger gaps as provisional
  — MAI-Image-2.6 is still a preview and Grok Imagine Image 2.0''s Arena scores are
  flagged preliminary.'
challengers:
- name: MAI-Image-2.6 (preview)
  note: 'Now #2 on Artificial Analysis''s text-to-image arena at 1351, just 20 points
    behind GPT Image 2 (1371) and ahead of Reve 2.1 (1322) — a narrower gap than at
    the last review. Still a preview, and no independent edge shown on editing.'
