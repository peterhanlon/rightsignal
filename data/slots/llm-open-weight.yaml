slot: llm-open-weight
category: language-models
title: Best open-weight LLM
question: What is the best open-weight large language model right now?
criteria:
- benchmark quality
- serving cost
- licence
- weights actually released
provisional: false
since: &id001 2026-09-10
pick:
  name: GLM-5.3
  version: ''
  url: https://huggingface.co/zai-org/GLM-5.3
  licence: glm-5.3 licence (Z.ai custom)
  why: GLM-5.3 (max) tops Artificial Analysis's open-weights table on Intelligence
    Index v4.3 with 45, one point clear of Kimi K3 (max) on 44, and the weights have
    been on Hugging Face since 28 August. On cost the two are effectively level —
    about $2.01 per Index task against K3's $2.00 — so the separator is throughput,
    with GLM-5.3 measured at roughly 66 output tokens per second against K3's 37.
    It ships under Z.ai's own glm-5.3 licence rather than a standard open one, and
    it takes text-only inputs.
caveats: GLM-5.3 ships under Z.ai's own glm-5.3 licence rather than MIT or Apache-2.0,
  and providers above $10bn in revenue need a Z.ai security review before commercial
  use, so read the LICENSE file in the repo before deploying. The weights landed on
  Hugging Face on 28 August, about two weeks after the August API launch, and the
  reign here is dated from 10 September. Artificial Analysis replaced v4.3 with Intelligence
  Index v5.0 on 27 October and re-based the whole table — GLM-5.3 (max) now reads
  32 at $5.01 per Index task, its worst-in-class cost among comparable open-weight
  models — so any v4.x score or cost figure is no longer comparable.
challengers:
- name: DeepSeek-V4.1-Flash-1017
  note: 'MIT-licensed, weights out and widely served in vLLM and SGLang. Artificial
    Analysis has now benchmarked it independently: 32 on Intelligence Index v5.0,
    level with GLM-5.3 (max) and joint best among models with released weights, at
    $0.60 per Index task against GLM-5.3''s $5.01. On the retired v4.3.2 scale it
    scored 45, a point behind Xiaomi''s MiMo-V2.6-Pro.'
