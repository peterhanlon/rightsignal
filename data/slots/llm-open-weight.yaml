pick:
  name: Kimi K3
  version: ''
  url: https://huggingface.co/moonshotai/Kimi-K3
  licence: Kimi K3 License (custom)
  why: 'A 2.8T-parameter MoE (104B active, 1M-token context, native vision) whose
    weights landed on Hugging Face on 27 July under Moonshot''s own licence. Artificial
    Analysis scores it 60 on the Intelligence Index, the top open-weights score on
    that board and two ahead of Qwen3.8-2.4T-A95B; it also took #1 on Arena''s frontend-code
    leaderboard at launch. It is enormous to self-host and slow at roughly 39 tokens
    per second even on Moonshot''s own API, but nothing open matches it on quality.'
caveats: Licence requires attribution above 100M MAU or $20M/month revenue, and a
  separate agreement for large model-as-a-service businesses. The hosted API shipped
  16 July — the reign is dated from the weights landing on 27 July.
challengers:
- name: Qwen3.8-2.4T-A95B
  note: 'Weights landed on 12 August under Alibaba''s own Qwen3.8-Max licence and
    score 58 on the AA Intelligence Index, two behind K3 and second among open weights
    on that board. Be careful with the openness: the released checkpoint is text-only
    with a 262K native context (extensible to roughly 1.01M), while vision input and
    the 1M default stay behind the hosted Qwen3.8-Max API. It is leaner to serve at
    95B active parameters against K3''s 104B, and Alibaba has since shipped a much
    smaller Apache-2.0 Qwen3.8-27B for teams that cannot host either flagship.'
