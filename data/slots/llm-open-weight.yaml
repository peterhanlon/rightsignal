pick:
  name: DeepSeek-V4.1-Flash-1017
  version: ''
  url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  licence: MIT
  why: Joint best score among released-weight models on Artificial Analysis's Intelligence
    Index v5.0 (32, level with GLM-5.3 max), but at about $0.60 per Index task against
    GLM-5.3's $5.01. MIT-licensed with no commercial-use review clause, weights on
    Hugging Face and broadly served in vLLM and SGLang.
caveats: GLM-5.3 ships under Z.ai's own glm-5.3 licence rather than MIT or Apache-2.0,
  and providers above $10bn in revenue need a Z.ai security review before commercial
  use, so read the LICENSE file in the repo before deploying. The weights landed on
  Hugging Face on 28 August, about two weeks after the August API launch, and the
  reign here is dated from 10 September. Artificial Analysis replaced v4.3 with Intelligence
  Index v5.0 on 27 October and re-based the whole table — GLM-5.3 (max) now reads
  32 at $5.01 per Index task, its worst-in-class cost among comparable open-weight
  models — so any v4.x score or cost figure is no longer comparable.
