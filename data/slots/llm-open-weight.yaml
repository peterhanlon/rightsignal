pick:
  name: GLM-5.3
  version: ''
  url: https://huggingface.co/zai-org/GLM-5.3
  licence: glm-5.3 licence (Z.ai custom)
  why: GLM-5.3 (max) tops Artificial Analysis's open-weights table on Intelligence
    Index v4.3 with 45, one point clear of Kimi K3 (max) on 44, and the weights have
    been on Hugging Face since 28 August. On cost the two are effectively level —
    about $2.01 per Index task against K3's $2.00 — so the separator is throughput,
    with GLM-5.3 measured at roughly 66 output tokens per second against K3's 37.
    It ships under Z.ai's own glm-5.3 licence rather than a standard open one, and
    it takes text-only inputs.
caveats: GLM-5.3 ships under Z.ai's own glm-5.3 licence rather than MIT or Apache-2.0,
  and providers above $10bn in revenue need a Z.ai security review before commercial
  use, so read the LICENSE file in the repo before deploying. The weights landed on
  Hugging Face on 28 August, about two weeks after the 14 August API launch, and the
  reign here is dated from 10 September. Artificial Analysis moved to Intelligence
  Index v4.3 on 7 September, so any v4.2 scores or cost-per-task figures are no longer
  comparable.
