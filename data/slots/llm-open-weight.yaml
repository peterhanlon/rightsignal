pick:
  name: DeepSeek-V4.1-Flash-1017
  version: ''
  url: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  licence: MIT
  why: Joint best score among released-weight models on Artificial Analysis's Intelligence
    Index v5.0 (32, level with GLM-5.3 max), but at about $0.60 per Index task against
    GLM-5.3's $5.01. MIT-licensed with no commercial-use review clause, weights on
    Hugging Face and broadly served in vLLM and SGLang.
caveats: 'GLM-5.3 ships under Z.ai''s own glm-5.3 licence rather than MIT or Apache-2.0,
  and model-as-a-service operators above $10bn in trailing-twelve-month revenue must
  pass a Z.ai security review before commercial use, so read the LICENSE file in the
  repo before you deploy. Dates differ by model: GLM-5.3''s weights landed on Hugging
  Face on 28 August 2026, about two weeks after its mid-August API launch, while the
  pick''s own weights went up on 17 October 2026 under MIT. Artificial Analysis replaced
  v4.3 with Intelligence Index v5.0 on 27 October and re-based the whole table — on
  the current v5.0.1 run DeepSeek V4.1 Flash 1017 (max) reads 33 at $0.60 per Index
  task against GLM-5.3 (max) at 32 and $5.01 — so no v4.x score or cost figure is
  comparable.'
challengers:
- name: Kimi K3.1 Pro
  note: 'Tops Artificial Analysis''s Intelligence Index v5.0.1 at 46 against the pick''s
    33, and the weights are no longer hypothetical: Moonshot put moonshotai/Kimi-K3.1-Pro
    on Hugging Face on 4 November 2026, ungated, at roughly 1.56TB, with vLLM and
    SGLang recipes on the card. The costs are the catch — AA measures $3.68 per Index
    task against the pick''s $0.60, and the bespoke Kimi K3.1 Pro licence needs a
    separate Moonshot agreement if you run a model-as-a-service business above $20m
    revenue. At 2.8T parameters it is a multi-node serve, so most teams will be renting
    it rather than hosting it.'
