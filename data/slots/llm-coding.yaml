pick:
  name: Claude Opus 5.5
  version: ''
  url: https://www.anthropic.com/claude/opus
  licence: proprietary
  why: Opus 5.5 tops the official Terminal-Bench 4.1 table at 65.76% with GPT-6 Astra
    fourth at 60.30%, ties Claude Fable 5.2 for first on Vals' 11 November Terminal-Bench
    4.0 board at 65.15%, and shares the lead on Artificial Analysis's Coding Agent
    Index v2.1 at 58. It is not the agentic leader everywhere — Kimi K3.1 Pro via
    Kimi Code CLI tops AA's Terminal-Bench 4.1 harness run at 68% — and Vals' fallback-adjusted
    view drops Opus 5.5 to 53.54% on 4.0, so check how much your harness leans on
    retries.
caveats: 'Vals'' Terminal-Bench 2.1 table is archived and superseded by Terminal-Bench
  4.0 in the coding sector of the Vals Index, and the two sit on different scales:
  on the 11 November 2026 4.0 board Claude Fable 5.2 and Claude Opus 5.5 tie for first
  at 65.15%, with Claude Sonnet 5.5 (64.14%), Kimi K3.1 Pro (63.64%) and Gemini 4
  Carbon (63.13%) all ahead of GPT-6 Astra''s 59.60%, and Opus 5 twelfth at 53.53%.
  The 87.64%/87.27%/84.64% figures belong to the archived 2.1 run, and Vals does publish
  fallback-adjusted versions on its model pages: counting fallback-assisted tasks
  as failures takes Opus 5.5 from 87.64% to 79.77% on 2.1 and from 61.62% to 53.54%
  on 4.0. Lean on the current 4.0 and repo-scale runs rather than the archived 2.1
  numbers.'
