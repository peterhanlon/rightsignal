slot: llm-coding
category: language-models
title: Best LLM for coding
question: What is the best large language model for coding right now?
criteria:
- agentic coding benchmarks
- repo-scale task performance
- tool-calling reliability
provisional: false
since: &id001 2026-09-09
pick:
  name: GPT-6 Astra
  version: ''
  url: https://developers.openai.com/api/docs/models/gpt-6-astra
  licence: proprietary
  why: GPT-6 Astra tops Artificial Analysis's independent Terminal-Bench v4.0 run
    at 59.6% on xhigh and 59.1% on max, with Claude Fable 5.1 next at 55.1% and Opus
    5 absent from the published top three. Vals.ai has it first on Terminal-Bench
    2.1 too, at 87.3% ahead of GPT-5.6 Sol (85.8%), Fable 5.1 (85.0%) and Opus 5 (84.6%).
    It has no independent SWE-bench Verified run — Vals archived that board as saturated
    — and it lists at $10/$50 per million tokens, 2.5x GPT-5.6 Sol, so price the high-volume
    repo-scale batches carefully.
caveats: 'Vals'' Terminal-Bench 2.1 table is now archived and superseded by Terminal-Bench
  4.0 in its coding index: Claude Opus 5.5 leads at 87.64%, GPT-6 Astra is second
  at 87.27% and Opus 5 has slipped to fifth at 84.64%, or 81.27% once its server-side
  fallbacks to Opus 4.8 on refused tasks are counted as failures. Vals also archived
  SWE-bench Verified as saturated in its 1 September 2026 update, where Opus 5 finished
  top at 97.00% at $1.29 a test and the open-weight DeepSeek V4 Pro 0813 second at
  96.40% for $0.10 a test. Lean on the Terminal-Bench 4.0 and repo-scale runs rather
  than either archived board.'
challengers:
- name: Claude Opus 5
  note: Claude Opus 5 still tops Vals' SWE-bench Verified board at 97.00%, but Vals
    archived that board as saturated in its 1 September 2026 update and never ran
    GPT-6 Astra on it. On Vals' Terminal-Bench 2.1, itself now archived in favour
    of 4.0, Opus 5 sits fifth at 84.64%, or 81.27% with its server-side Opus 4.8 fallbacks
    counted as failures, behind Opus 5.5, Astra, GPT-5.6 Sol and Fable 5.1. On Vals'
    Terminal-Bench 4.0 it manages 53.53% against Opus 5.5's 61.62%, so treat it as
    a legacy option rather than a live contender.
