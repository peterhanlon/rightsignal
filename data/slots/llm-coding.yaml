slot: llm-coding
category: language-models
title: Best LLM for coding
question: What is the best large language model for coding right now?
criteria:
- agentic coding benchmarks
- repo-scale task performance
- tool-calling reliability
provisional: false
since: 2026-07-24
pick:
  name: Claude Opus 5
  version: ''
  url: https://www.anthropic.com/claude/opus
  licence: proprietary
  why: Tops vals.ai's independent SWE-bench Verified run at 97.0%, the best of 82
    systems on that board, and sits second on their Terminal-Bench 2.1 table at 84.64%.
    At $5/$25 per million tokens it is half the price of Claude Fable 5 ($10/$50)
    for scores within a point or two across the coding suite. Tracker refreshes through
    mid-August still name it the sensible default for repo-scale agentic work.
caveats: 'vals.ai''s Terminal-Bench 2.1 table now has Opus 5 fourth at 84.64%, behind
  GPT-6 Astra (87.27%), GPT-5.6 Sol (85.77%) and Claude Fable 5.1 (85.02%), and its
  own figure drops to 81.27% if you count its server-side fallbacks to Opus 4.8 on
  refused tasks as failures. The SWE-bench Verified lead is thin as well: DeepSeek
  V4 Pro (0813) sits second at 96.40% against 97.00%, as an open-weight model costing
  roughly $0.02 per task against $1.29 for Opus 5. Worth knowing that vals has since
  dropped SWE-bench Verified from its coding index altogether, calling the benchmark
  saturated, so lean on terminal and repo-scale evidence rather than that one number.'
challengers:
- name: GPT-6 Astra
  note: First on Terminal-Bench 2.1 at 58.2% against Opus 5's 51.8%, and first on
    Arena WebDev at 1796 against 1688 — the agentic and tool-use evidence points the
    same way on both boards. It costs more ($10/$50 versus $5/$25) and has no independent
    SWE-bench Verified run yet, so Opus 5 stays the cheaper option for repo-scale
    batch work.
- name: GPT-6 Astra Max
  note: Tops vals' overall index and sits second on Arena WebDev at 1,764, but trails
    Astra on Terminal-Bench 2.1 (85.02%) and still refuses bio- and cyber-adjacent
    tasks.
- name: gpt-6-astra-max
  note: 'Now #1 on Arena WebDev at 1,797, 35 points clear of claude-fable-5.1-max
    (1,762) and well ahead of claude-opus-5-max (1,688), though on only about 1,199
    votes so far. This is not just a human-preference result: vals.ai also has GPT-6
    Astra top of Terminal-Bench 2.1 at 87.27%, ahead of GPT-5.6 Sol (85.77%) and Claude
    Fable 5.1 (85.02%), and top of Code Migration. No independent SWE-bench Verified
    run has appeared yet, and it is priced at $10/$50 against Opus 5''s $5/$25.'
