pick:
  name: Claude Opus 5.5
  version: ''
  url: https://www.anthropic.com/claude/opus
  licence: proprietary
  why: Opus 5.5 leads Vals' Terminal-Bench 4.0 at 65.15% (5 November 2026), well clear
    of GPT-6 Astra in fifth at 59.60%, and it also led Astra on Vals' earlier 2.1
    run (87.64% v 87.27%). No published independent run has Astra ahead of it. It
    is unscored on the official Terminal-Bench board and on SWE-bench Verified, so
    its repo-scale evidence is thinner than its agentic-terminal record.
caveats: 'Vals'' Terminal-Bench 2.1 table is archived and superseded by Terminal-Bench
  4.0 in the coding sector of the Vals Index, and the two sit on different scales:
  on the 5 November 2026 4.0 board Claude Opus 5.5 leads at 65.15%, with Claude Sonnet
  5.5 (64.14%), Kimi K3.1 Pro (63.64%) and Gemini 4 Carbon (63.13%) all ahead of GPT-6
  Astra''s 59.60%, and Opus 5 tenth at 53.53%. The 87.64%/87.27%/84.64% figures belong
  to the archived 2.1 run, and Vals publishes no fallback-adjusted version of them.
  Vals also archived SWE-bench Verified as saturated in its 1 September 2026 update,
  where Opus 5 finished top at 97.00% at $1.29 a test and the open-weight DeepSeek
  V4 Pro 0813 second at 96.40% for $0.10 a test, so lean on the 4.0 and repo-scale
  runs rather than either archived board.'
