slot: llm-coding
category: language-models
title: Best LLM for coding
question: What is the best large language model for coding right now?
criteria:
- agentic coding benchmarks
- repo-scale task performance
- tool-calling reliability
provisional: false
since: 2026-07-24
pick:
  name: Claude Opus 5
  version: ''
  url: https://www.anthropic.com/claude/opus
  licence: proprietary
  why: Tops vals.ai's independent SWE-bench Verified run at 97.0%, the best of 82
    systems on that board, and sits second on their Terminal-Bench 2.1 table at 84.64%.
    At $5/$25 per million tokens it is half the price of Claude Fable 5 ($10/$50)
    for scores within a point or two across the coding suite. Tracker refreshes through
    mid-August still name it the sensible default for repo-scale agentic work.
caveats: 'Genuinely contested on terminal work: vals.ai puts GPT-5.6 Sol first on
  Terminal-Bench 2.1 at 85.77% against Opus 5''s 84.64%, and Opus 5''s figure falls
  to 81.27% if you count its server-side fallbacks to Opus 4.8 on refused tasks as
  failures. The SWE-bench Verified lead is narrowing too — DeepSeek V4 Pro (0813)
  now sits second at 96.40% against 97.0%, as an open-weight model at a fraction of
  the cost per task.'
challengers:
- name: gpt-6-astra-max
  note: 'New #1 on Arena WebDev at 1,797, 35 points clear of claude-fable-5.1-max
    (1,762) and well ahead of claude-opus-5-max (1,688) — but a human-preference web
    board, with no independent SWE-bench Verified or Terminal-Bench run yet.'
- name: Claude Fable 5.1 Max
  note: 'New #1 on Arena WebDev at 1,765, a clear 77-point lead over qwen3.8-max-0902
    (1,688) and claude-opus-5-max (1,687) — but a human-preference web board, with
    no independent SWE-bench Verified or Terminal-Bench run yet.'
- name: Qwen3.8-Max-0902
  note: 'New #1 on Arena WebDev at 1,691, four points above claude-opus-5-max (1,687)
    — a tie in practice, and a human-preference web board rather than an agentic or
    repo-scale measure. No independent SWE-bench or Terminal-Bench run yet.'
