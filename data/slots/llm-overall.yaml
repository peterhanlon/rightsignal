provisional: false
since: 2026-07-01
pick:
  name: Claude Fable 5
  version: ''
  url: https://www.anthropic.com/claude/fable
  licence: proprietary
  why: Number one on the Arena (formerly LMArena) text leaderboard through the August
    snapshots, with a 1M-token context window. It debuted on 9 June, was pulled on
    12 June when the US applied export controls to it and Mythos 5, and returned on
    1 July after the Commerce Department lifted them on 30 June. It also tops the
    official Terminal-Bench 2.1 board at 83.8% with Claude Code at xhigh effort, just
    ahead of GPT-5.5 on Codex at 83.1%.
caveats: The top of the Arena text board sits inside its own noise band — the leading
  four, three Claude variants and Meta's Muse Spark 1.2, are one statistical tie —
  so treat Fable's lead as first-among-equals rather than a win, and note that Claude
  Opus 5, released on 24 July, now belongs in that chasing group. Artificial Analysis
  scores Opus 5 (max) at 63 against Fable's 62 and calls the two effectively tied,
  at $5/$25 per million tokens versus Fable's $10/$50 — half the list price, though
  only about 26% cheaper per Intelligence Index task. On terminal work Fable still
  holds first place on the official Terminal-Bench 2.1 board, while Artificial Analysis's
  own runs put GPT-5.6 Sol on top with Opus 5 roughly level, so the answer depends
  on whose harness you trust.
challengers:
- name: Claude Opus 5
  note: Vellum publishes per-benchmark charts rather than a composite, and the 64.7
    is its Humanity's Last Exam board, which Opus 5 tops ahead of Mythos 5 on 64.5;
    Fable 5 is missing from that chart alone, since Vellum scores it elsewhere at
    95% on SWE-Bench and first on OSWorld at 85%. The stronger argument is Artificial
    Analysis, where Opus 5 (max) takes the Intelligence Index at 63 to Fable's 62
    for $5/$25 against $10/$50, and 26% less per Index task. That is the best case
    yet for a change, but it is not enough while Fable holds the Arena text top spot
    and first place on the official Terminal-Bench 2.1 board.
- name: Muse Spark 1.2
  note: 'Meta''s frontier line and the nearest non-Anthropic challenger on user-preference
    voting, though the exact Arena rating should be read off the live board rather
    than quoted here. On agentic terminal work it is credible rather than leading:
    Muse Spark 1.1 scores 76.2% on the official Terminal-Bench 2.1 board with mini-SWE-agent,
    some seven points behind Fable 5, but at roughly a third of the run cost.'
- name: Kimi K3
  note: The open-weight titleholder crossing over — 60 on the Artificial Analysis
    index, two behind Fable at a fraction of the price, and inside the Arena text
    top ten at 1,490. The closest any open model gets to the overall crown on either
    axis.
