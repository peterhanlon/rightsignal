pick:
  name: Claude Fable 5
  version: ''
  url: https://www.anthropic.com/claude/fable
  licence: proprietary
  why: Number one on the Arena (formerly LMArena) text leaderboard through the August
    snapshots, with a 1M-token context window. It debuted on 9 June, was pulled on
    12 June when the US applied export controls to it and Mythos 5, and returned on
    1 July after the Commerce Department lifted them on 30 June. It also tops the
    official Terminal-Bench 2.1 board at 83.8% with Claude Code at xhigh effort, just
    ahead of GPT-5.5 on Codex at 83.1%.
caveats: 'The Arena text board is tight at the top: Fable leads at roughly 1,525 with
  Claude Opus 4.8, GPT-5.5 Pro and Gemini 3.1 Pro Preview clustered behind it, so
  treat the lead as first-among-equals and read the exact tie band off the live board.
  Artificial Analysis now ranks Claude Opus 5 (max and xhigh) first on its Intelligence
  Index at 63 to Fable''s 62 — a one-point gap rather than a declared tie — at $2.34
  per Index task against Fable''s $3.14. On terminal work Fable still holds first
  place on the official Terminal-Bench 2.1 board at 83.8% with Claude Code at xhigh,
  a board Opus 5 has yet to appear on at all.'
challengers:
- name: GPT-6 Astra
  note: Reported to have raised Epoch AI's Capability Index record from 163 to 169,
    but the claim reaches us via social posts rather than the Epoch board, and there
    is no Arena, Terminal-Bench 2.1 or Artificial Analysis placement yet — access
    may not even be public.
- name: Claude Opus 5
  note: Vellum publishes per-benchmark charts rather than a composite, and the 64.7
    is its Humanity's Last Exam board, which Opus 5 tops ahead of Mythos 5 on 64.5;
    Fable 5 is missing from that chart alone, since Vellum scores it elsewhere at
    95% on SWE-Bench and first on OSWorld at 85%. The stronger argument is Artificial
    Analysis, where Opus 5 (max) takes the Intelligence Index at 63 to Fable's 62
    for $5/$25 against $10/$50, and 26% less per Index task. That is the best case
    yet for a change, but it is not enough while Fable holds the Arena text top spot
    and first place on the official Terminal-Bench 2.1 board.
- name: Muse Spark 1.2
  note: 'Meta''s frontier line and a genuine name to watch, though its standing on
    user-preference voting should be read off the live Arena board rather than asserted
    here — Artificial Analysis puts Muse Spark 1.2 (xhigh) at 57 on the Intelligence
    Index, five behind Fable''s 62. On agentic terminal work it is credible rather
    than leading: Muse Spark 1.1 scores 76.2% on the official Terminal-Bench 2.1 board
    with mini-SWE-agent, 7.6 points behind Fable 5, but at $198 a run against Fable''s
    $553.'
