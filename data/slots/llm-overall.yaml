pick:
  name: Claude Fable 5
  version: ''
  url: https://www.anthropic.com/claude/fable
  licence: proprietary
  why: 'Number one on the Arena (formerly LMArena) text leaderboard in the 12 August
    snapshot, with a 1M-token context window and adaptive thinking that cannot be
    switched off. It debuted on 9 June, was pulled on 12 June when the US government
    applied export controls to it and Mythos 5, and came back on 1 July once those
    controls were lifted. It does not lead Terminal-Bench 2.1, though: independent
    trackers put GPT-5.6 Sol on top there, with Claude Opus 5 also ahead of Fable.'
caveats: The top of the Arena text board sits inside its own noise band, so treat
  Fable's lead over the chasing Claude Opus 4.8, GPT-5.5 Pro and Gemini 3.1 Pro cluster
  as a tie rather than a win. The cheaper Claude Opus 5 edges it on the Artificial
  Analysis Intelligence Index, roughly 63.0 against 62.1, at about half the price.
  On agentic terminal work, GPT-5.6 Sol currently leads Terminal-Bench 2.1.
challengers:
- name: Claude Opus 5
  note: Edges Fable on the Artificial Analysis Intelligence Index at half the price;
    GPT-5.6 Sol is the strongest external rival.
- name: Grok 4.6
  note: xAI's 12 Aug flagship matches GPT-5.6 Sol on the AA Intelligence Index (61),
    one point behind Fable, at $2/$6 per million tokens.
