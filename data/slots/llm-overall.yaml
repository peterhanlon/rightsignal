pick:
  name: Claude Fable 5
  version: ''
  url: https://www.anthropic.com/claude/fable
  licence: proprietary
  why: 'Number one on the LMArena text leaderboard (1506 in the 12 Aug snapshot) and
    top of the official Terminal-Bench 2.1 board, with a 1M-token context window and
    always-on adaptive thinking. It debuted at #1 on 9 June, was suspended 12-30 June
    under US export controls, and has held the Arena top spot continuously since access
    was restored on 1 July.'
caveats: Statistically tied at the top — 1506±5 against its own sibling claude-opus-4-6-high
  at 1505±4 — and the cheaper Claude Opus 5 edges it on the Artificial Analysis
  Intelligence Index.
challengers:
- name: Claude Opus 5
  note: Edges Fable on the Artificial Analysis Intelligence Index at half the price;
    GPT-5.6 Sol is the strongest external rival.
- name: Grok 4.6
  note: xAI's 12 Aug flagship matches GPT-5.6 Sol on the AA Intelligence Index (61),
    one point behind Fable, at $2/$6 per million tokens.
