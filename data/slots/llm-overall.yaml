pick:
  name: Gemini 4 Carbon (High)
  version: ''
  url: https://deepmind.google/models/gemini/
  licence: proprietary
  why: First on the live Artificial Analysis Intelligence Index v5 at 60, ahead of
    Claude Opus 5.5 (Max) on 59, and holding that position across the 31 October and
    8 November fetches. Also first on Arena text in the published 28 October data.
    Proprietary and hosted, at about $7.76 per Index task, and Claude Opus 5.5 still
    leads Vellum's HLE board and the neutral Terminal-Bench 4.0 run, so check the
    agentic coding case separately.
caveats: 'Artificial Analysis v5.0.1 has moved again: read on 22 November the board
  runs Claude Fable 5.2 (max) 65 at $26.54 per task, GPT-6.2 Astra (max) 62 at $4.00,
  Gemini 4 Neon (xhigh) 61 at $6.44, Gemini 4 Carbon (high) fourth on 60 at $7.76
  and Claude Opus 5.5 (max) 59 at $10.04 — Astra and Neon only landed on 17 and 18
  November, so anything quoting the v5.0 launch figures of 59, 58 and 57 is two releases
  behind. Carbon does not lead the agentic board either: Vals AI''s neutral mini-SWE-agent
  run of Terminal-Bench 4.0 had Claude Fable 5.2 and Claude Opus 5.5 tied on 65.15%
  as of 19 November, with Carbon absent from the top rows. Arena text is the one board
  Carbon still holds, first at 1539 on the board published 19 November, but on roughly
  4,300 votes against tens of thousands for the models below it, so treat it as provisional.'
challengers:
- name: Claude Fable 5.2 (Max)
  note: 'Still tops Artificial Analysis Intelligence Index v5.0.1 on 65, held since
    its 9 November release, but it is no longer measured against Carbon directly:
    GPT-6.2 Astra (max) on 62 and Gemini 4 Neon (xhigh) on 61 now sit between them,
    and at $26.54 per index task Fable 5.2 is the dearest entry on the board against
    $4.00 for Astra. It is not a one-board result — Vals AI''s neutral mini-SWE-agent
    run has it tied with Claude Opus 5.5 at the top of Terminal-Bench 4.0 on 65.15%,
    and it leads WebDev Arena on 1824. It has still not taken Arena text, where Gemini
    4 Carbon leads at 1539.'
