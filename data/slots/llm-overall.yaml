pick:
  name: Gemini 4 Carbon (High)
  version: ''
  url: https://deepmind.google/models/gemini/
  licence: proprietary
  why: First on the live Artificial Analysis Intelligence Index v5 at 60, ahead of
    Claude Opus 5.5 (Max) on 59, and holding that position across the 31 October and
    8 November fetches. Also first on Arena text in the published 28 October data.
    Proprietary and hosted, at about $7.76 per Index task, and Claude Opus 5.5 still
    leads Vellum's HLE board and the neutral Terminal-Bench 4.0 run, so check the
    agentic coding case separately.
caveats: Artificial Analysis now runs Intelligence Index v5.0.1, and the live board
  is led by Claude Fable 5.2 (max) on 65, with Fable 5.2 at high and xhigh on 62,
  Gemini 4 Carbon (high) fourth on 60 at $7.76 per task, Claude Opus 5.5 (max) on
  59 and GPT-6 Astra (max) on 57 — the v5.0 launch figures of 59, 58 and 57 no longer
  apply. On Terminal-Bench 4.0 the 57.9% figure is a Claude Code max-effort row for
  Fable 5.1 on the official board, which runs each vendor in its own agent and so
  cannot rank vendors against each other; Vals AI's neutral mini-SWE-agent run now
  has Claude Fable 5.2 and Claude Opus 5.5 tied at the top on 65.15%. Arena is the
  one board Carbon still leads, first on text at about 1526 as read on 6 November,
  though that entry is still flagged preliminary on only a few thousand votes.
challengers:
- name: Claude Fable 5.2 (Max)
  note: 'Tops Artificial Analysis Intelligence Index v5.0.1 on 65 since its 9 November
    release, five points clear of Gemini 4 Carbon''s 60, but at $26.54 per index task
    it is comfortably the most expensive entry on that board. It is no longer a single-board
    result: Vals AI''s neutral mini-SWE-agent run has it tied with Claude Opus 5.5
    at the top of Terminal-Bench 4.0 on 65.15%. It has not taken Arena text, where
    Gemini 4 Carbon still leads.'
