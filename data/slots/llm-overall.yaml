pick:
  name: Gemini 4 Carbon (High)
  version: ''
  url: https://deepmind.google/models/gemini/
  licence: proprietary
  why: First on the live Artificial Analysis Intelligence Index v5 at 60, ahead of
    Claude Opus 5.5 (Max) on 59, and holding that position across the 31 October and
    8 November fetches. Also first on Arena text in the published 28 October data.
    Proprietary and hosted, at about $7.76 per Index task, and Claude Opus 5.5 still
    leads Vellum's HLE board and the neutral Terminal-Bench 4.0 run, so check the
    agentic coding case separately.
caveats: 'Artificial Analysis has re-based again: the live board is Intelligence Index
  v5, where Gemini 4 Carbon (high) leads on 59, Claude Opus 5.5 (max) is on 58 and
  GPT-6 Astra (max) on 57, while Claude Fable 5.1 reads 50 (xhigh, $10.85 per task)
  and 49 (max, $12.99) — so the v4.3 score of 53 and the $7.63 against $3.26 comparison
  no longer apply. On Terminal-Bench 4.0 the 57.9% figure is a Claude Code max-effort
  row on the official board, which runs each vendor in its own agent and so cannot
  rank vendors against each other; Vals AI''s neutral mini-SWE-agent run puts Claude
  Opus 5.5 first at 65.15%, with Anthropic quoting 66.4% itself. Arena has moved on
  too: its published 28 October board has Gemini 4 Carbon and Claude Opus 5.5 at the
  top with Fable 5.1 fourth overall, so ignore the 2 September 1507/1504 snapshot
  and read the live board.'
