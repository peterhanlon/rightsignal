pick:
  name: Claude Fable 5
  version: ''
  url: https://www.anthropic.com/claude/fable
  licence: proprietary
  why: Number one on the Arena (formerly LMArena) text leaderboard through the August
    snapshots, with a 1M-token context window. It debuted on 9 June, was pulled on
    12 June when the US applied export controls to it and Mythos 5, and returned on
    1 July after the Commerce Department lifted them on 30 June. It also tops the
    official Terminal-Bench 2.1 board at 83.8% with Claude Code at xhigh effort, just
    ahead of GPT-5.5 on Codex at 83.1%.
caveats: The top of the Arena text board sits inside its own noise band, so treat
  Fable's lead over the chasing Claude and Gemini cluster as a tie rather than a win,
  and note that Claude Opus 5, released on 24 July, now belongs in that group. Artificial
  Analysis scores Opus 5 (max) at 61 against Fable's 60 and calls the two effectively
  tied, at $5/$25 per million tokens versus Fable's $10/$50 — half the list price,
  though only about 26% cheaper per Intelligence Index task. On terminal work Fable
  still holds first place on the official Terminal-Bench 2.1 board, while Artificial
  Analysis's own runs put GPT-5.6 Sol on top with Opus 5 roughly level, so the answer
  depends on whose harness you trust.
challengers:
- name: Claude Opus 5
  note: 'Meta''s frontier line and the nearest non-Anthropic challenger on user-preference
    voting, though the exact Arena rating should be read off the live board rather
    than quoted here. On agentic terminal work it is credible rather than leading:
    Muse Spark 1.1 scores 76.2% on the official Terminal-Bench 2.1 board with mini-SWE-agent,
    some seven points behind Fable 5, but at roughly a third of the run cost.'
- name: Muse Spark 1.2
  note: Meta's frontier entry sits fourth on the Arena text board at 1,498±10 in its
    xHigh setting — the nearest non-Claude rival to Fable's 1,506, closer than Grok
    4.6 or GPT-5.6 Sol get on that board.
