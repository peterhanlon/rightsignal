slot: llm-small
category: language-models
title: Best small / on-device LLM
question: What is the best small language model to run on-device right now?
criteria:
- quality per GB
- tool-calling under quantisation
- runs in 16GB RAM
provisional: false
since: 2026-04-02
pick:
  name: Gemma 4 26B A4B
  version: ''
  url: https://huggingface.co/google/gemma-4-26B-A4B-it
  licence: Apache-2.0
  why: 'A 25.2B-total MoE with only 3.8B active parameters, so it decodes at small-model
    speed, and Google''s quantisation-aware training keeps 4-bit quality close to
    bfloat16. The Q4_0 GGUF weighs 14.6GB, so it loads on a 16GB machine but leaves
    only about a gigabyte for KV cache — plan for modest context, not the full 256K.
    The pick is about deployability: official Q4_0 QAT builds, native function calling
    and image input, rather than raw benchmark score.'
caveats: Qwen3.6 27B (Reasoning) is the quality leader here, scoring 38 on Artificial
  Analysis's Intelligence Index, and it is Apache-2.0 with a 262k context. But it
  is a 27.8B dense model, so its 4-bit builds are heavier than a 3.8B-active MoE,
  and headroom is tight either way — the pick's own Q4_0 GGUF is already 14.6GB on
  a 16GB box. This title is under active review.
challengers:
- name: Qwen3.6 27B (Reasoning)
  note: The quality leader on AA's small open-source board; squeezes into 16GB at
    4-bit with little headroom for context.
- name: Muse Glimmer 30B
  note: Meta's agent-focused 30B (AA 35), Apache-2.0 — new, and still settling.
