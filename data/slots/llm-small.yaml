slot: llm-small
category: language-models
title: Best small / on-device LLM
question: What is the best small language model to run on-device right now?
criteria:
- quality per GB
- tool-calling under quantisation
- runs in 16GB RAM
provisional: false
since: 2026-04-02
pick:
  name: Gemma 4 26B A4B
  version: ''
  url: https://huggingface.co/google/gemma-4-26B-A4B-it
  licence: Apache-2.0
  why: 'A 25.2B-total MoE with only 3.8B active parameters, so it decodes at small-model
    speed, and Google''s quantisation-aware training keeps 4-bit quality close to
    bfloat16. The Q4_0 GGUF weighs 14.6GB, so it loads on a 16GB machine but leaves
    only about a gigabyte for KV cache — plan for modest context, not the full 256K.
    The pick is about deployability: official Q4_0 QAT builds, native function calling
    and image input, rather than raw benchmark score.'
caveats: 'Qwen3.6 27B (Reasoning) is the quality leader here — 38 on Artificial Analysis''s
  Intelligence Index, Apache-2.0, 262k context — but it is a 27.8B dense model whose
  4-bit GGUFs land between 15.4GB and 16.8GB, which is past what a 16GB machine can
  usefully host. The pick''s official Q4_0 QAT GGUF is 14.4GB, and that gap is the
  whole argument for it: it is the only one of the three that loads with anything
  left for KV cache. This title is under active review, chiefly because Meta''s Muse
  Glimmer 30B now outscores the pick on the same index.'
challengers:
- name: Qwen3.8 27B
  note: 'Still #1 on AA''s small open-source board (52 vs this pick''s 26), and quantised
    GGUF builds are now circulating — but the trending one is a community abliterated
    remix with no published file sizes, so the 16GB fit and quantised tool-calling
    remain unverified.'
- name: Muse Glimmer 30B
  note: Meta's agent-focused 30B dense model, Apache-2.0, independently scored 35
    on the AA Intelligence Index — comfortably ahead of this pick's 26, though still
    a little behind Qwen3.6 27B. Meta's own agentic numbers are vendor-run and framed
    against Gemma's dense 31B sibling and Qwen3.6 rather than this MoE pick, so read
    them with the usual caution. Capability is plainly rising; the unanswered question
    for this slot is whether a dense 30B ever lands in 16GB with usable context.
- name: Qwen3.6 27B (Reasoning)
  note: The quality leader on AA's small open-source board; squeezes into 16GB at
    4-bit with little headroom for context.
