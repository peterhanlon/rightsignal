slot: llm-small
category: language-models
title: Best small / on-device LLM
question: What is the best small language model to run on-device right now?
criteria:
- quality per GB
- tool-calling under quantisation
- runs in 16GB RAM
provisional: false
since: 2026-04-02
pick:
  name: Gemma 4 26B A4B
  version: ''
  url: https://huggingface.co/google/gemma-4-26B-A4B-it
  licence: Apache-2.0
  why: 'A 25.2B-total MoE with only 3.8B active parameters, so it decodes at small-model
    speed, and Google''s quantisation-aware training keeps 4-bit quality close to
    bfloat16. Be specific about which file you pull: Unsloth measured a naive Q4_0
    conversion of the QAT checkpoint at 70.2% top-1 against 85.6% for their dynamic
    UD-Q4_K_XL build at 14.2GB, so prefer that over Google''s own 14.4GB q4_0 GGUF,
    and budget the roughly 15GB of total memory it wants — it loads on a 16GB machine
    but leaves little room for KV cache, so plan for modest context rather than the
    full 256K. The pick is about deployability: Apache-2.0 weights, QAT builds sized
    for laptops, native function calling and image input, rather than raw benchmark
    score.'
caveats: Qwen3.8 27B is still the quality leader in this size class — on Artificial
  Analysis's re-based v4.3 index it scores 34 at xhigh (31 medium, 29 low) against
  this pick's 17 — but the only official quantised build is Qwen's ~31GB FP8 repo,
  so a 16GB fit remains unproven; Qwen3.6 27B (22 reasoning, 27.8B, 262k) now sits
  well behind it, and community 4-bit GGUFs of a 27B dense model land around 17GB,
  too heavy for a 16GB machine. The pick's QAT int4 GGUF is 14.2GB in Unsloth's dynamic
  build (14.4GB for a naive Q4_0 conversion) and wants roughly 15GB of total memory,
  and that gap is the whole argument for it. The title stays under review because
  a verified 4-bit Qwen3.8 build with published file sizes would likely take the slot.
challengers:
- name: MiniCPM5-2B
  note: OpenBMB has now published an official GGUF build tagged for tool-calling and
    on-device use, so the deployability gap is narrowing — but no file sizes, no independent
    4-bit retention figures and no tool-calling-under-quantisation numbers, and at
    15 on Artificial Analysis it still sits below this pick's 17.
- name: Qwen3.8 27B
  note: Still the quality leader in this size class — Artificial Analysis's re-based
    v4.3 index puts it at 34/31/29 across xhigh/medium/low against this pick's 17,
    with non-reasoning at 22. Qwen's only official quantised build is the FP8 release,
    a 30.9GB GPU-oriented repo; there is no official 4-bit or GGUF build, no independent
    4-bit quality-retention numbers and nothing on tool-calling under quantisation.
    Community 4-bit GGUFs sit around 17GB for Q4_K_M, so the 16GB fit stays unverified.
- name: Qwen3.8-Flash-Next
  note: NVIDIA has now published an NVFP4 quantisation on Hugging Face, but it is
    a GPU-oriented format with no listed file size, no independent benchmark placement
    and no tool-calling-under-quantisation numbers, so the 16GB fit is still unverified;
    the base card also lists its licence only as "other".
