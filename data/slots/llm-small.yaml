slot: llm-small
category: language-models
title: Best small / on-device LLM
question: What is the best small language model to run on-device right now?
criteria:
- quality per GB
- tool-calling under quantisation
- runs in 16GB RAM
provisional: false
since: 2026-04-02
pick:
  name: Gemma 4 26B A4B
  version: ''
  url: https://huggingface.co/google/gemma-4-26B-A4B-it
  licence: Apache-2.0
  why: 'A 25.2B-total MoE with only 3.8B active parameters, so it decodes at small-model
    speed, and Google''s quantisation-aware training keeps 4-bit quality close to
    bfloat16. Be specific about which file you pull: Unsloth measured a naive Q4_0
    conversion of the QAT checkpoint at 70.2% top-1 against 85.6% for their dynamic
    UD-Q4_K_XL build at 14.2GB, so prefer that over Google''s own 14.4GB q4_0 GGUF,
    and budget the roughly 15GB of total memory it wants — it loads on a 16GB machine
    but leaves little room for KV cache, so plan for modest context rather than the
    full 256K. The pick is about deployability: Apache-2.0 weights, QAT builds sized
    for laptops, native function calling and image input, rather than raw benchmark
    score.'
caveats: 'Qwen3.8 27B no longer has this size class to itself: Artificial Analysis''s
  Intelligence Index v5.0.1 puts it at 20 at xhigh (17 medium, 16 low, 10 non-reasoning),
  Nanbeige4.3-33B now matches it at 20, and the pick is unscored on that board. Neither
  challenger has surfaced an official 4-bit or GGUF build with published file sizes
  in our checks, so a 16GB fit is unproven for both, whereas the pick''s QAT int4
  GGUF is a measured 14.25GB in Unsloth''s dynamic build against 14.44GB for a naive
  Q4_0 conversion of the same checkpoint, and wants roughly 15GB of RAM. The title
  stays under review because a verified 4-bit build from either challenger, with published
  file sizes and tool-calling numbers, would likely take the slot.'
challengers:
- name: Nanbeige4.3-33B
  note: 'Matches Qwen3.8 27B (xhigh) at 20 on Artificial Analysis''s Intelligence
    Index v5.0.1 rather than leading it — the earlier 306-vs-303 figures were on the
    pre-v5 scale and no longer apply. The strengths are lopsided: 30% on Terminal-Bench
    4.0 against Qwen''s 6%, but 7% on HLE-Diamond against 15%, and it spends 158K
    output tokens per index task to Qwen''s 110K. We have found no official 4-bit
    or GGUF build, no published file sizes to confirm a 16GB fit and no tool-calling-under-quantisation
    data, so treat it as a quality signal only.'
- name: MiniCPM5-2B
  note: 'OpenBMB''s official GGUF build is up, tagged for tool-calling and on-device
    use, with published file sizes — 1.56GB at Q4_K_M — so it clears a 16GB budget
    with room to spare. What is still missing is independent 4-bit retention data
    and any tool-calling-under-quantisation numbers. We have dropped the Artificial
    Analysis comparison for now: the index has re-based to v5.0 and the pick is unscored
    on it, so there is no like-for-like quality gap to quote; treat this as a deployability
    story rather than a quality one.'
- name: Qwen3.8 27B
  note: 'No longer the outright quality leader here: Artificial Analysis''s Intelligence
    Index v5.0.1 puts it at 20/17/16 across xhigh/medium/low and 10 non-reasoning,
    level with Nanbeige4.3-33B at 20, while the pick carries no v5 score at all. Against
    Nanbeige it wins on knowledge and code — 15% vs 7% on HLE-Diamond, 15% vs 11%
    on FrontierCode 2.0 — but loses heavily on Terminal-Bench 4.0 at 6% vs 30%. On
    deployability nothing has moved: we have found no official 4-bit or GGUF build
    and nothing published on tool-calling under quantisation, so the 16GB fit stays
    unproven.'
