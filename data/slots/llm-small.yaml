slot: llm-small
category: language-models
title: Best small / on-device LLM
question: What is the best small language model to run on-device right now?
criteria:
- quality per GB
- tool-calling under quantisation
- runs in 16GB RAM
provisional: false
since: 2026-04-02
pick:
  name: Gemma 4 26B A4B
  version: ''
  url: https://huggingface.co/google/gemma-4-26B-A4B-it
  licence: Apache-2.0
  why: A 25.2B-total MoE with only 3.8B active parameters, so 4-bit builds (~13-14GB)
    fit in 16GB RAM with real context headroom while decoding at small-model speeds.
    The pick is about deployability — official quantisation-aware GGUFs from Google
    with quality preserved at 4-bit, native function-calling and multimodal input —
    not raw benchmark score.
caveats: Qwen3.6 27B (Reasoning) scores far higher on AA's small open-source board
  (38 vs 26), but its 4-bit builds run 15.4-15.9GB — inside the letter of the 16GB
  bar with almost no room left for context. This title is under active review.
challengers:
- name: Qwen3.6 27B (Reasoning)
  note: The quality leader on AA's small open-source board; squeezes into 16GB at
    4-bit with little headroom for context.
- name: Muse Glimmer 30B
  note: Meta's agent-focused 30B (AA 35), Apache-2.0 — new, and still settling.
