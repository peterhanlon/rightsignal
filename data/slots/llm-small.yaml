slot: llm-small
category: language-models
title: Best small / on-device LLM
question: What is the best small language model to run on-device right now?
criteria:
- quality per GB
- tool-calling under quantisation
- runs in 16GB RAM
provisional: false
since: 2026-04-02
pick:
  name: Gemma 4 26B A4B
  version: ''
  url: https://huggingface.co/google/gemma-4-26B-A4B-it
  licence: Apache-2.0
  why: 'A 25.2B-total MoE with only 3.8B active parameters, so it decodes at small-model
    speed, and Google''s quantisation-aware training keeps 4-bit quality close to
    bfloat16. Be specific about which file you pull: Unsloth measured a naive Q4_0
    conversion of the QAT checkpoint at 70.2% top-1 against 85.6% for their dynamic
    UD-Q4_K_XL build at 14.2GB, so prefer that over Google''s own 14.4GB q4_0 GGUF,
    and budget the roughly 15GB of total memory it wants — it loads on a 16GB machine
    but leaves little room for KV cache, so plan for modest context rather than the
    full 256K. The pick is about deployability: Apache-2.0 weights, QAT builds sized
    for laptops, native function calling and image input, rather than raw benchmark
    score.'
caveats: Qwen3.8 27B is still the quality leader in this size class — on Artificial
  Analysis's re-based v4.3 index it scores 34 at xhigh (28 medium, 26 low) against
  this pick's 17, with the non-reasoning variant at 22 — but the only official quantised
  build is Qwen's FP8 repo, so a 16GB fit remains unproven, and the third-party 4-bit
  builds that do exist, such as Unsloth's 23.4GB NVFP4, are GPU-oriented and well
  over a 16GB budget. The pick's QAT int4 GGUF is 14.2GB in Unsloth's dynamic build,
  about 200MB smaller than a naive Q4_0 conversion of the same checkpoint, and wants
  roughly 15GB of total memory; that gap is the whole argument for it. The title stays
  under review because a verified 4-bit Qwen3.8 build with published file sizes would
  likely take the slot.
challengers:
- name: MiniCPM5-2B
  note: OpenBMB's official GGUF build is now up, tagged for tool-calling and on-device
    use, and the file sizes are published — 1.56GB at Q4_K_M, 2.68GB at Q8_0, 5.04GB
    at F16 — so it clears a 16GB budget with room to spare. What is still missing
    is independent 4-bit retention data and any tool-calling-under-quantisation numbers.
    On Artificial Analysis's re-based v4.3 index it sits at 13 against this pick's
    17, so it is a deployability story rather than a quality one.
- name: Qwen3.8 27B
  note: Still the quality leader in this size class — Artificial Analysis's re-based
    v4.3 index puts it at 34/28/26 across xhigh/medium/low against this pick's 17,
    with non-reasoning at 22. Qwen's only official quantised build remains the FP8
    release, a GPU-oriented repo; there is no official 4-bit or GGUF build and nothing
    published on tool-calling under quantisation. Third-party NVFP4 checkpoints have
    now appeared with head-to-head comparisons, but Unsloth's is 23.4GB and aimed
    at datacentre GPUs, so the 16GB fit stays unverified.
- name: Qwen3.8-Flash-Next
  note: NVIDIA has now published an NVFP4 quantisation on Hugging Face, but it is
    a GPU-oriented format with no listed file size, no independent benchmark placement
    and no tool-calling-under-quantisation numbers, so the 16GB fit is still unverified;
    the base card also lists its licence only as "other".
