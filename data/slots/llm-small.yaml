slot: llm-small
category: language-models
title: Best small / on-device LLM
question: What is the best small language model to run on-device right now?
criteria:
- quality per GB
- tool-calling under quantisation
- runs in 16GB RAM
provisional: false
since: 2026-04-02
pick:
  name: Gemma 4 26B A4B
  version: ''
  url: https://huggingface.co/google/gemma-4-26B-A4B-it
  licence: Apache-2.0
  why: 'A 25.2B-total MoE with only 3.8B active parameters, so it decodes at small-model
    speed, and Google''s quantisation-aware training keeps 4-bit quality close to
    bfloat16 — take the QAT int4 GGUF at 14.2GB rather than a naive Q4_0 conversion,
    which Unsloth measured at 70.2% top-1 against 85.6% for their dynamic build. At
    around 15GB of total memory it loads on a 16GB machine but leaves little room
    for KV cache, so plan for modest context rather than the full 256K. The pick is
    about deployability: Apache-2.0 weights, QAT builds sized for laptops, native
    function calling and image input, rather than raw benchmark score.'
caveats: Qwen3.8 27B is now the quality leader in this size class — 52 on Artificial
  Analysis's Intelligence Index at xhigh effort against this pick's 26 — but there
  is still no official quantised release with published file sizes, so its 16GB fit
  is unproven; Qwen3.6 27B (38, Apache-2.0, 262k, 27.8B dense) sits behind it and
  is likewise too heavy at 4-bit for a 16GB machine. The pick's QAT int4 GGUF is 14.2GB
  and wants roughly 15GB of total memory, and that gap is the whole argument for it.
  This title is under active review chiefly because Qwen3.8 27B has pushed the ceiling
  so far above the pick that a verified quantised build would likely take the slot.
challengers:
- name: Qwen3.8 27B
  note: Still the quality leader by a wide margin (52/44/43 across efforts on AA's
    small open-source board against this pick's 26), and community mixed-precision
    GGUFs from ISTA-DASLab are now trending — but with no published file sizes and
    no independent quality-retention or tool-calling numbers at 4-bit, the 16GB fit
    remains unverified.
- name: Qwen3.8-Flash-Next
  note: New Qwen release trending on Hugging Face with community GGUFs already available
    two days after launch, and multimodal like the pick — but no independent benchmark
    placement yet, no published quantised file sizes to test the 16GB fit, and the
    card lists its licence only as "other".
- name: Muse Glimmer 30B
  note: 'Meta''s agent-focused 30B dense model, Apache-2.0, independently scored 35
    on the AA Intelligence Index — comfortably ahead of this pick''s 26, though still
    behind Qwen3.6 27B at 38. Meta''s own agentic numbers are vendor-run and framed
    against Gemma 4 31B and Qwen3.6 rather than this MoE pick, so read them with the
    usual caution. For this slot the size question is already settled: Meta''s official
    4-bit build is sized for 24–32GB of VRAM, so it is not a 16GB candidate today.'
